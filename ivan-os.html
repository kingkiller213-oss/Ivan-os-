<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivan OS</title>
<meta name="description" content="Ivan OS is a mobile-friendly songwriting and music production workspace you can install on your phone.">
<meta name="theme-color" content="#12141A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ivan OS">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0B0F; --surface:#12141A; --surface-2:#191D26;
  --line:rgba(239,234,225,.07); --line-2:rgba(239,234,225,.14);
  --ivory:#EFEAE1; --dim:rgba(239,234,225,.56); --faint:rgba(239,234,225,.30);
  --ghost:rgba(239,234,225,.13);
  --brass:#C8A45C; --moon:#7F97BC; --ember:#C4664E; --jade:#71A183;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,.8,.28,1);
  --pad:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void)}
body{color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.playing{padding-bottom:calc(204px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:1.5px solid var(--brass);outline-offset:3px;border-radius:2px}

.label{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.serif{font-family:var(--serif);font-weight:400}
.meter{height:2px;background:var(--ghost);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass);border-radius:2px;transition:width .7s var(--ease)}
.meter.finished i{background:var(--jade)}
.art{border-radius:7px;position:relative;overflow:hidden;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(239,234,225,.09)}
.art::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.13),transparent 60%)}

.view{display:none;animation:rise .5s var(--ease) both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.greeting{padding:40px var(--pad) 24px}
.greeting .date{margin-bottom:10px}
.greeting h1{font-family:var(--serif);font-size:32px;line-height:1.14;margin:0;font-weight:400}
.greeting h1 em{font-style:italic;color:var(--brass)}
.streak{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.streak b{color:var(--brass);font-weight:400}

.quick{display:flex;gap:8px;padding:0 var(--pad) 20px;flex-wrap:wrap}
.quick button{flex:1 1 30%;padding:13px 6px;border:1px solid var(--line-2);border-radius:10px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);transition:all .25s var(--ease)}
.quick button:active{background:var(--surface-2)}
.quick button.key{border-color:var(--brass);color:var(--brass)}
.quick button.alert{border-color:rgba(127,151,188,.5);color:var(--moon)}

.hero{margin:0 var(--pad) 34px;border-radius:16px;position:relative;overflow:hidden;
  border:1px solid var(--line);transition:transform .3s var(--ease)}
.hero:active{transform:scale(.988)}
.hero-wash{position:absolute;inset:0;opacity:.5;filter:blur(38px) saturate(1.25);transform:scale(1.4)}
.hero-veil{position:absolute;inset:0;background:linear-gradient(165deg,rgba(10,11,15,.5),rgba(10,11,15,.94) 70%)}
.hero-in{position:relative;padding:26px 24px 24px;display:block;width:100%;text-align:left}
.hero h2{font-family:var(--serif);font-size:37px;line-height:1.05;margin:13px 0 0;font-weight:400}
.hero .stageline{font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--brass);margin-top:10px}
.brief{margin-top:22px;display:flex;flex-direction:column;gap:15px}
.brief-row{display:flex;gap:14px;align-items:flex-start}
.brief-key{width:8px;flex:0 0 auto;padding-top:6px}
.brief-key i{display:block;width:5px;height:5px;border-radius:50%;background:var(--brass)}
.brief-row.b2 .brief-key i{background:var(--moon)}
.brief-row.b3 .brief-key i{background:var(--jade)}
.brief-body{flex:1;min-width:0}
.brief-body .label{margin-bottom:4px}
.brief-body p{margin:0;font-size:15px;line-height:1.45}
.brief-body p.none{color:var(--faint);font-style:italic}
.hero-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.est{font-family:var(--mono);font-size:11px;color:var(--dim)}
.enter{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.hero-empty{padding:32px 24px 34px}
.hero-empty p{color:var(--dim);font-size:14.5px;margin:11px 0 0;max-width:34ch}

.block{margin-bottom:36px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 var(--pad);margin-bottom:16px}
.section-head .more{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase}

.albumcard{margin:0 var(--pad) 36px;padding:22px;border-radius:14px;
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);display:block;width:calc(100% - var(--pad)*2);text-align:left}
.albumcard:active{transform:scale(.99)}
.albumcard .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.albumcard h3{font-family:var(--serif);font-size:26px;margin:8px 0 0;font-weight:400;line-height:1.1}
.pct{font-family:var(--serif);font-size:40px;line-height:1;color:var(--brass)}
.pct sub{font-family:var(--mono);font-size:10px;vertical-align:super;color:var(--faint)}
.trackdots{display:flex;gap:4px;margin-top:20px;flex-wrap:wrap}
.trackdots span{height:3px;flex:1 1 14px;min-width:14px;border-radius:3px;background:var(--ghost)}
.trackdots span.mid{background:var(--brass);opacity:.5}
.trackdots span.hot{background:var(--brass)}
.trackdots span.fin{background:var(--jade)}
.albumcard .legend{display:flex;gap:18px;margin-top:15px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

.cards{padding:0 var(--pad);display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:16px;padding:16px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);width:100%;text-align:left;align-items:flex-start;
  transition:transform .28s var(--ease),background .28s var(--ease)}
.card:active{transform:scale(.985);background:var(--surface-2)}
.card .art{width:64px;height:64px}
.card-body{flex:1;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h4{font-family:var(--serif);font-size:20px;margin:0;font-weight:400;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pnum{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto;padding-top:4px}
.card .sub{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .sub b{color:var(--brass);font-weight:400}
.card.fin .sub b{color:var(--jade)}
.card .aud{color:var(--moon)}
.card .meter{margin:12px 0 10px}
.card .next{font-size:13.5px;color:var(--dim);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .next.none{color:var(--faint);font-style:italic}
.flag{width:5px;height:5px;border-radius:50%;background:var(--ember);flex:0 0 auto}
.attention .card{border-color:rgba(196,102,78,.2)}

.arow{display:flex;align-items:center;gap:15px;padding:14px var(--pad);
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.arow:active{background:var(--surface)}
.arow .play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--brass)}
.arow .play.off{color:var(--faint);border-style:dashed}
.arow .ab{flex:1;min-width:0}
.arow .ab h5{font-family:var(--serif);font-size:17px;margin:0;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ab p{margin:3px 0 0;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint)}
.arow .at{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}

.notecard{margin:0 var(--pad);padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.notecard textarea{width:100%;background:transparent;resize:vertical;min-height:70px;
  font-size:14.5px;line-height:1.6;color:var(--ivory)}
.notecard textarea:focus{outline:none}
.notecard textarea::placeholder{color:var(--faint);font-style:italic}

.goal{display:flex;gap:13px;align-items:flex-start;padding:13px var(--pad);border-bottom:1px solid var(--line)}
.goal p{margin:0;flex:1;font-size:14.5px}
.goal.done p{color:var(--faint);text-decoration:line-through}
.goal .x{color:var(--faint);font-size:15px;padding:0 2px}

.filters{display:flex;gap:7px;overflow-x:auto;padding:4px var(--pad) 22px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;padding:8px 13px;border-radius:20px;border:1px solid var(--line-2);
  color:var(--dim);transition:all .25s var(--ease)}
.filters button[aria-pressed="true"]{background:var(--ivory);color:var(--void);border-color:var(--ivory)}

.albumhero{padding:40px var(--pad) 28px}
.bigmeter{margin:26px 0 10px}
.albumstats{display:flex;gap:26px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint)}
.albumstats b{display:block;font-family:var(--serif);font-size:27px;letter-spacing:0;
  text-transform:none;color:var(--ivory);font-weight:400;margin-bottom:3px}
.tracklist{padding:0 var(--pad)}
.trow{display:flex;align-items:center;gap:15px;padding:14px 0;
  border-bottom:1px solid var(--line);background:var(--void)}
.trow.dragging{opacity:.5;background:var(--surface-2)}
.grip{width:24px;flex:0 0 auto;color:var(--faint);font-size:15px;cursor:grab;
  touch-action:none;padding:8px 0;text-align:center}
.tnum{font-family:var(--mono);font-size:11px;color:var(--faint);width:20px;flex:0 0 auto}
.tbody{flex:1;min-width:0}
.tbody h5{font-family:var(--serif);font-size:18px;margin:0;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbody .tm{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px;
  letter-spacing:.1em;text-transform:uppercase}
.tbody .meter{margin-top:7px;max-width:150px}
.tpct{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto}
.addrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.addrow span{font-size:14.5px;color:var(--dim)}
.addbtn{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--void);overflow-y:auto;display:none;padding-bottom:70px}
.sheet.open{display:block;animation:rise .38s var(--ease) both}
body.playing .sheet{padding-bottom:194px}
.sheetbar{position:sticky;top:0;z-index:10;background:rgba(10,11,15,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;justify-content:space-between;align-items:center;
  padding:17px var(--pad);border-bottom:1px solid var(--line)}
.sheetbar button{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.sheetbar .go{color:var(--brass)}
.saveflag{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--jade);opacity:0;transition:opacity .3s}
.saveflag.on{opacity:1}

.songhead{padding:30px var(--pad) 22px;display:flex;gap:19px;align-items:flex-start}
.songhead .art{width:92px;height:92px;border-radius:9px}
.songhead .hd{flex:1;min-width:0}
.in-title{font-family:var(--serif);font-size:30px;line-height:1.1;width:100%;padding:0;margin:0;font-weight:400}
.in-title::placeholder{color:var(--ghost)}
.songhead .stageline{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);margin-top:9px}
.songhead .meter{margin-top:13px}

.tabs{display:flex;overflow-x:auto;padding:0 var(--pad);border-bottom:1px solid var(--line);
  scrollbar-width:none;position:sticky;top:55px;background:rgba(10,11,15,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:15px 14px 13px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button:first-child{padding-left:0}
.tabs button[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--brass)}

.pane{padding:30px var(--pad) 0;animation:fade .35s var(--ease) both}
.field{margin-bottom:26px}
.field>.label{display:block;margin-bottom:9px}
.hint{font-size:12.5px;color:var(--faint);margin:7px 0 0;line-height:1.5}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:13px 14px;font-size:15px;line-height:1.6;transition:border-color .25s var(--ease)}
.in:focus{outline:none;border-color:var(--line-2)}
.in::placeholder{color:var(--faint)}
textarea.in{resize:vertical;min-height:96px}
textarea.lyr{min-height:320px;font-family:var(--mono);font-size:13.5px;line-height:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.in.mono{font-family:var(--mono);font-size:13px;text-align:center;padding:13px 6px}
.sublabel{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 9px;display:block}

.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{padding:9px 14px;border-radius:20px;border:1px solid var(--line-2);color:var(--dim);
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  transition:all .25s var(--ease)}
.pick button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--void)}
.pick.pri button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--void)}
.pick.gear button[aria-pressed="true"]{background:var(--moon);border-color:var(--moon);color:var(--void)}

/* lifecycle */
.life{margin-bottom:8px}
.lifebar{display:flex;gap:2px;margin-bottom:12px}
.lifebar u{flex:1;height:4px;border-radius:2px;background:var(--ghost);transition:background .3s var(--ease)}
.lifebar u.on{background:var(--brass)}
.lifebar u.now{background:var(--ivory)}
.lifelist{display:flex;flex-direction:column}
.lifestep{display:flex;align-items:center;gap:14px;padding:10px 0;position:relative;width:100%;text-align:left}
.lifestep::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--line)}
.lifestep:first-child::before{top:50%}
.lifestep:last-child::before{bottom:50%}
.lifestep i{width:11px;height:11px;border-radius:50%;flex:0 0 auto;z-index:1;
  background:var(--void);border:1px solid var(--line-2);transition:all .3s var(--ease)}
.lifestep.done i{background:var(--brass);border-color:var(--brass)}
.lifestep.here i{background:var(--ivory);border-color:var(--ivory);box-shadow:0 0 0 5px rgba(239,234,225,.1)}
.lifestep span{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.lifestep.done span{color:var(--dim)}
.lifestep.here span{color:var(--ivory)}
.lifestep b{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--moon);font-weight:400}

.tl{position:relative;padding-left:24px;margin-top:8px}
.tl::before{content:"";position:absolute;left:3.5px;top:7px;bottom:10px;width:1px;background:var(--line)}
.ev{position:relative;padding-bottom:22px}
.ev::before{content:"";position:absolute;left:-24px;top:6px;width:8px;height:8px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line-2)}
.ev.key::before{background:var(--brass);border-color:var(--brass)}
.ev.audio::before{background:var(--moon);border-color:var(--moon)}
.ev.session::before{background:var(--jade);border-color:var(--jade)}
.ev time{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.ev p{margin:0;font-size:14.5px;line-height:1.45}

/* audio */
.ver{border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px;background:var(--surface)}
.ver.now{border-color:rgba(200,164,92,.4)}
.ver-top{display:flex;align-items:flex-start;gap:14px}
.ver .pbtn{width:40px;height:40px;border-radius:50%;flex:0 0 auto;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--brass)}
.ver.now .pbtn{background:var(--brass);color:var(--void);border-color:var(--brass)}
.ver .pbtn.off{color:var(--faint);border-style:dashed}
.ver .vh{flex:1;min-width:0}
.ver .vname{font-family:var(--serif);font-size:19px;line-height:1.2;width:100%;padding:0;font-weight:400}
.ver .vmeta{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
.ver .vmeta b{color:var(--brass);font-weight:400}
.ver .vx{color:var(--faint);font-size:16px;padding:2px}
.wave{display:flex;align-items:center;gap:1px;height:36px;margin:15px 0 11px;cursor:pointer}
.wave u{flex:1;background:var(--ghost);border-radius:1px;min-height:2px;transition:background .1s linear}
.wave u.on{background:var(--brass)}
.wave.flat{background:var(--ghost);height:2px;border-radius:2px;display:block}
.wave.flat u{display:none}
.vnote{width:100%;background:transparent;padding:0;font-size:14px;color:var(--dim);
  line-height:1.5;resize:none;min-height:24px}
.vnote:focus{outline:none;color:var(--ivory)}
.vnote::placeholder{color:var(--faint);font-style:italic}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.fname{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:80px}
.fname.live{color:var(--jade)}
.vact{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--moon);flex:0 0 auto}
.drop{border:1px dashed var(--line-2);border-radius:14px;padding:30px 22px;text-align:center;width:100%}
.drop h4{font-family:var(--serif);font-size:21px;margin:0 0 7px;font-weight:400}
.drop p{margin:0;color:var(--faint);font-size:13px;line-height:1.5}
.hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* player */
.player{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:55;
  background:rgba(18,20,26,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line-2);padding:13px 20px 14px;display:none;animation:rise .3s var(--ease) both}
.player.on{display:block}
.pl-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pl-top h6{font-family:var(--serif);font-size:16px;margin:0;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brass);flex:0 0 auto}
.pl-close{color:var(--faint);font-size:15px;padding:0 2px;flex:0 0 auto}
.pl-mid{display:flex;align-items:center;gap:14px;margin-top:10px}
.pl-play{width:38px;height:38px;border-radius:50%;background:var(--ivory);color:var(--void);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px}
.pl-wave{flex:1;min-width:0}
.pl-wave .wave{height:26px;margin:0}
.pl-time{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:0 0 auto}
.pl-bot{display:flex;align-items:center;gap:15px;margin-top:10px}
.pl-bot button{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);flex:0 0 auto}
.pl-bot .vol{flex:1;height:18px}

/* in-song transport */
.transport{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);
  margin-bottom:22px}
.transport.on{border-color:rgba(200,164,92,.34);
  background:linear-gradient(155deg,var(--surface-2),var(--surface))}
.transport .pl-mid{margin-top:16px}
.tp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tp-head h5{font-family:var(--serif);font-size:21px;margin:6px 0 0;font-weight:400;line-height:1.15}
.tp-stop{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ember);border:1px solid rgba(196,102,78,.3);border-radius:20px;padding:8px 13px;flex:0 0 auto}
.tp-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.tp-file{font-family:var(--mono);font-size:9px;color:var(--jade);letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px;min-width:0}
.tp-spec{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.1em;flex:0 0 auto}
.tp-rates{display:flex;gap:5px;flex:0 0 auto}
.tp-rate{font-family:var(--mono);font-size:9px;color:var(--faint);border:1px solid var(--line-2);
  border-radius:20px;padding:6px 9px;transition:all .25s var(--ease)}
.tp-rate.on{background:var(--brass);border-color:var(--brass);color:var(--void)}
.ver .vmeta .fmt{color:var(--moon)}

.slider{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:none}
.slider::-webkit-slider-runnable-track{height:2px;background:var(--ghost);border-radius:2px}
.slider::-moz-range-track{height:2px;background:var(--ghost);border-radius:2px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--brass);margin-top:-7px;border:none}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--brass);border:none}
.vol::-webkit-slider-thumb{width:11px;height:11px;margin-top:-4.5px}
.vol::-moz-range-thumb{width:11px;height:11px}

.task{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.box{width:20px;height:20px;flex:0 0 auto;border:1px solid var(--line-2);border-radius:6px;
  margin-top:1px;position:relative;transition:all .25s var(--ease)}
.box.on{background:var(--brass);border-color:var(--brass)}
.box.on::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
  border:solid var(--void);border-width:0 1.5px 1.5px 0;transform:rotate(43deg)}
.task p{margin:0;flex:1;font-size:14.5px;line-height:1.45}
.task.done p{color:var(--faint);text-decoration:line-through}
.task .x{color:var(--faint);font-size:16px;padding:0 2px}
.rowadd{display:flex;gap:11px;align-items:center}
.rowadd input,.rowadd select{flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:13px 14px;font-size:14.5px;min-width:0}
.rowadd input:focus,.rowadd select:focus{outline:none;border-color:var(--line-2)}
.rowadd button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);padding:0 4px;flex:0 0 auto}

.vrail{display:flex;gap:7px;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.vrail::-webkit-scrollbar{display:none}
.vchip{flex:0 0 auto;padding:9px 14px;border-radius:20px;border:1px solid var(--line-2);
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.vchip[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--void)}
.vchip.add{color:var(--brass);border-style:dashed}

/* producer + intelligence */
.subnav{display:flex;gap:7px;overflow-x:auto;padding:0 var(--pad) 24px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;padding:9px 15px;border-radius:20px;border:1px solid var(--line-2);
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.subnav button[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--void)}
.qs{display:flex;flex-direction:column;gap:9px;padding:0 var(--pad) 30px}
.q{padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  text-align:left;font-family:var(--serif);font-size:18px;font-weight:400}
.q:active{border-color:var(--brass)}
.answer{margin:0 var(--pad) 28px;padding:22px;border:1px solid var(--line-2);border-radius:14px;
  background:linear-gradient(155deg,var(--surface-2),var(--surface));animation:rise .4s var(--ease) both}
.answer h4{font-family:var(--serif);font-size:23px;margin:0 0 16px;font-weight:400;line-height:1.2}
.aline{display:flex;gap:12px;padding:8px 0;font-size:14.5px;line-height:1.5;color:var(--dim)}
.aline i{color:var(--brass);font-style:normal;flex:0 0 auto;font-family:var(--mono);font-size:10px;padding-top:3px;min-width:26px}
.aline b{color:var(--ivory);font-weight:400}
.answer .foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.answer .foot button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass)}
.thinking{color:var(--faint);font-style:italic}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 var(--pad) 26px}
.stat{padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1;color:var(--brass)}
.stat span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-top:8px}
.stat.wide{grid-column:1/-1}
.stat.wide b{font-size:22px;color:var(--ivory);line-height:1.3}
.bars{padding:0 var(--pad) 26px}
.bar{display:flex;align-items:center;gap:12px;padding:7px 0}
.bar .bl{font-family:var(--mono);font-size:10px;color:var(--dim);width:78px;flex:0 0 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{flex:1;height:4px;background:var(--ghost);border-radius:2px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--brass);border-radius:2px}
.bar .bn{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}

/* gear */
.gitem{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.gitem .gb{flex:1;min-width:0}
.gitem h5{font-family:var(--serif);font-size:18px;margin:0;font-weight:400}
.gitem .gc{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);margin-top:4px}
.gitem .gn{font-size:13.5px;color:var(--dim);margin-top:6px;line-height:1.45;
  width:100%;background:transparent;resize:none;min-height:20px}
.gitem .gn:focus{outline:none;color:var(--ivory)}
.gitem .gn::placeholder{color:var(--faint);font-style:italic}
.gitem .x{color:var(--faint);font-size:16px;padding:2px}
.wish{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:11px;background:var(--surface)}
.wish.got{border-color:rgba(113,161,131,.35)}
.wish-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wish h5{font-family:var(--serif);font-size:19px;margin:0;font-weight:400}
.wish .pr{font-family:var(--serif);font-size:20px;color:var(--brass);flex:0 0 auto}
.wish .wm{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
.wish .wm b{color:var(--ember);font-weight:400}
.wish .ww{font-size:13.5px;color:var(--dim);margin-top:10px;line-height:1.5;
  width:100%;background:transparent;resize:none;min-height:22px}
.wish .ww:focus{outline:none;color:var(--ivory)}
.wish .wf{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wish .wf button{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--moon)}
.wish .wf button.del{color:var(--faint);margin-left:auto}

/* session */
.session{position:fixed;inset:0;z-index:70;background:var(--void);display:none;overflow-y:auto}
.session.on{display:block;animation:rise .4s var(--ease) both}
.ses-wash{position:absolute;inset:0;opacity:.34;filter:blur(60px) saturate(1.3);transform:scale(1.5)}
.ses-veil{position:absolute;inset:0;background:linear-gradient(175deg,rgba(10,11,15,.6),var(--void) 62%)}
.ses-in{position:relative;padding:44px var(--pad) 60px;min-height:100%}
.timer{font-family:var(--serif);font-size:60px;line-height:1;margin:16px 0 4px}
.timer.run{color:var(--brass)}
.ses-song{font-family:var(--serif);font-size:29px;margin:26px 0 0;font-weight:400;line-height:1.15}
.ses-goal{color:var(--dim);font-size:15px;line-height:1.5;margin:9px 0 0}
.ses-block{margin-top:32px}
.ses-block>.label{display:block;margin-bottom:12px}
.ses-btns{display:flex;gap:10px;margin-top:34px}
.ses-btns button{flex:1;padding:16px;border-radius:11px;border:1px solid var(--line-2);
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ses-btns button.key{background:var(--brass);border-color:var(--brass);color:var(--void)}
.sumrow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.sumrow span{color:var(--dim);font-size:14.5px}
.sumrow b{font-family:var(--mono);font-size:12px;color:var(--brass);font-weight:400}

.acts{display:flex;flex-direction:column;gap:10px;padding:38px var(--pad) 0;
  margin-top:16px;border-top:1px solid var(--line)}
.act{padding:15px;border:1px solid var(--line);border-radius:11px;text-align:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);width:100%;display:block}
.act.on{border-color:var(--brass);color:var(--brass)}
.act.key{background:var(--brass);border-color:var(--brass);color:var(--void)}
.act.danger{color:var(--ember);border-color:rgba(196,102,78,.2)}

.empty{padding:70px 36px;text-align:center}
.empty h2{font-family:var(--serif);font-size:26px;font-weight:400;margin:0 0 11px}
.empty p{color:var(--dim);margin:0 auto;font-size:14.5px;line-height:1.55;max-width:32ch}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:56;background:rgba(10,11,15,.93);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--line);display:flex;padding:0 4px calc(9px + env(safe-area-inset-bottom))}
.nav button{flex:1;padding:16px 1px 11px;font-family:var(--mono);font-size:8px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);position:relative}
.nav button[aria-current="true"]{color:var(--ivory)}
.nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:16px;height:1px;background:var(--brass)}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:41;
  width:54px;height:54px;border-radius:50%;background:var(--ivory);color:var(--void);
  font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
body.playing .fab{bottom:calc(204px + env(safe-area-inset-bottom))}
.fab:active{transform:scale(.9)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--line-2);padding:12px 19px;border-radius:24px;
  font-family:var(--mono);font-size:10.5px;z-index:95;opacity:0;
  transition:opacity .25s var(--ease);pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.footer{padding:48px var(--pad) 12px;text-align:center}
.footer button{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(239,234,225,.16)}

/* ---------- confirm modal (replaces window.confirm, which sandboxed
   browsers silently suppress — that made Delete appear to do nothing) ---------- */
.scrim{position:fixed;inset:0;z-index:120;background:rgba(6,7,10,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:26px}
.scrim.on{display:flex;animation:fade .22s var(--ease) both}
.dlg{width:100%;max-width:400px;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:18px;padding:26px;animation:pop .3s var(--ease) both;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.dlg h3{font-family:var(--serif);font-size:25px;margin:0 0 10px;font-weight:400;line-height:1.2}
.dlg p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.55}
.dlg .dbtns{display:flex;gap:10px;margin-top:26px}
.dlg .dbtns button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line-2);
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.dlg .dbtns button.ok{background:var(--ivory);border-color:var(--ivory);color:var(--void)}
.dlg .dbtns button.ok.danger{background:var(--ember);border-color:var(--ember);color:#fff}
.toast.undo{pointer-events:auto;display:flex;align-items:center;gap:16px}
.toast.undo button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass)}

/* ---------- composition assistant ---------- */
.prog{border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:16px;margin-bottom:11px}
.prog.alt{border-style:dashed}
.prog-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog-sec{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.prog-top .x{color:var(--faint);font-size:16px;padding:2px}
.prog input.pin{width:100%;background:transparent;font-family:var(--serif);font-size:21px;
  padding:8px 0 0;line-height:1.3}
.prog input.pin:focus{outline:none}
.prog input.pin::placeholder{color:var(--ghost)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip-c{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:5px 9px;border-radius:6px;
  background:rgba(200,164,92,.12);color:var(--brass);border:1px solid rgba(200,164,92,.22)}
.chip-c.out{background:rgba(196,102,78,.1);color:var(--ember);border-color:rgba(196,102,78,.24)}
.chip-c.unk{background:transparent;color:var(--faint);border-color:var(--line-2)}
.prog .pnote{width:100%;background:transparent;font-size:13.5px;color:var(--dim);
  resize:none;min-height:22px;margin-top:10px;line-height:1.5}
.prog .pnote:focus{outline:none;color:var(--ivory)}
.prog .pnote::placeholder{color:var(--faint);font-style:italic}

.tline{padding:0 var(--pad)}
.tsec{position:relative;padding:0 0 8px 26px}
.tsec::before{content:"";position:absolute;left:4px;top:12px;bottom:-6px;width:1px;background:var(--line)}
.tsec:last-child::before{display:none}
.tsec>i{position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;
  background:var(--brass);border:1px solid var(--brass)}
.tsec .tname{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);padding-top:5px}
.tsec .tchords{font-family:var(--serif);font-size:22px;line-height:1.35;margin:4px 0 14px}
.tsec .tchords em{font-style:normal;color:var(--faint);font-size:16px;padding:0 4px}
.tsec .trn{font-family:var(--mono);font-size:9.5px;color:var(--moon);letter-spacing:.1em;margin:-10px 0 14px}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 var(--pad) 22px}
.ccard{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:14px;text-align:left}
.ccard:active{border-color:var(--brass)}
.ccard h5{font-family:var(--serif);font-size:20px;margin:0 0 3px;font-weight:400}
.ccard .cm{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ccard .cd{margin-top:10px;display:flex;justify-content:center}
.ccard .diff{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--jade);margin-top:8px;display:block}
.ccard .diff.med{color:var(--brass)}
.ccard .diff.hard{color:var(--ember)}
svg.fret .nut{stroke:var(--ivory);stroke-width:2.4}
svg.fret line{stroke:var(--line-2);stroke-width:1}
svg.fret circle.dot{fill:var(--brass)}
svg.fret text{fill:var(--faint);font-family:var(--mono);font-size:7px}
svg.fret .barre{fill:var(--brass);opacity:.85}
svg.keys .w{fill:#1E222A;stroke:var(--line-2);stroke-width:.8}
svg.keys .w.on{fill:var(--brass)}
svg.keys .b{fill:#0A0B0F;stroke:var(--line-2);stroke-width:.8}
svg.keys .b.on{fill:var(--brass)}

.theory{border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:18px;margin:0 var(--pad) 14px}
.theory h5{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px;font-weight:400}
.theory .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.theory .why{font-size:13.5px;color:var(--dim);line-height:1.55;margin:0}
.sim{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:10px;background:var(--surface)}
.sim.high{border-color:rgba(196,102,78,.34)}
.sim-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sim h5{font-family:var(--serif);font-size:19px;margin:0;font-weight:400}
.sim .pcth{font-family:var(--mono);font-size:12px;color:var(--brass)}
.sim.high .pcth{color:var(--ember)}
.sim p{margin:8px 0 0;font-size:13.5px;color:var(--dim);line-height:1.5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="view on" id="v-studio">
  <div class="greeting">
    <div class="label date" id="gdate"></div>
    <h1 id="gtext"></h1>
    <div class="streak" id="streak"></div>
  </div>
  <div class="quick" id="quick"></div>
  <div id="heroSlot"></div>
  <div id="albumSlot"></div>
  <div id="studioBlocks"></div>
  <div class="footer"><button id="resetBtn">Reset everything</button></div>

async function load(){
  for(const key of [K5].concat(OLD)){
    try{

function migrate(d, key){
  if(key === K5) return d;
  /* v2–v4 used a 6-stage model; map it onto the 13-stage lifecycle */
  const map = {0:0, 1:2, 2:1, 3:5, 4:7, 5:10};
  (d.songs||[]).forEach(function(s){
    s.stage = map[s.stage] !== undefined ? map[s.stage] : 0;
    (s.audio||[]).forEach(function(v){
      v.status = map[v.status] !== undefined ? map[v.status] : 0;
    });
  });
  return d;
}

}

/* ============ 4  AUDIO ============ */
/* Reads real sample rate / bit depth from the file header where the format allows it. */
async function readSpecs(file){
  const out={sampleRate:0,bitDepth:0,channels:0};
  try{
    const head=new Uint8Array(await file.slice(0,64*1024).arrayBuffer());
    const str=function(o,n){ let s=""; for(let i=0;i<n;i++) s+=String.fromCharCode(head[o+i]); return s; };
    const u16=o=>head[o]|(head[o+1]<<8);
    const u32=o=>head[o]|(head[o+1]<<8)|(head[o+2]<<16)|(head[o+3]<<24);
    if(str(0,4)==="RIFF" && str(8,4)==="WAVE"){
      let p=12;
      while(p<head.length-8){
        const id=str(p,4), size=u32(p+4);
        if(id==="fmt "){
          out.channels=u16(p+10); out.sampleRate=u32(p+12); out.bitDepth=u16(p+22);
          break;
        }
        p+=8+size+(size%2);
      }
      return out;
    }
    /* MP3 — skip ID3v2 then read the first frame header */
    let p=0;
    if(str(0,3)==="ID3") p = 10 + ((head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9]);
    for(let i=p;i<head.length-4;i++){
      if(head[i]===0xFF && (head[i+1]&0xE0)===0xE0){
        const verBits=(head[i+1]>>3)&3, rateBits=(head[i+2]>>2)&3;
        const table={3:[44100,48000,32000], 2:[22050,24000,16000], 0:[11025,12000,8000]};
        const row=table[verBits];
        if(row && rateBits<3){
          out.sampleRate=row[rateBits];
          out.channels=((head[i+3]>>6)&3)===3?1:2;
        }
        break;
      }
    }
  }catch(e){}
  return out;
}
async function makePeaks(file, verId){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const dec=await actx.decodeAudioData(await file.arrayBuffer());
    if(verId) buffers[verId]=dec;          /* kept for the Web Audio fallback engine */
    const ch=dec.getChannelData(0);
    const block=Math.floor(ch.length/PEAKS)||1;
    const out=[]; let max=0.0001;
    for(let i=0;i<PEAKS;i++){
      let sum=0,n=0;
      for(let j=0;j<block;j+=8){ const v=ch[i*block+j]; if(v!==undefined){ sum+=v*v; n++; } }
      const rms=Math.sqrt(sum/Math.max(1,n));
      out.push(rms); if(rms>max) max=rms;
    }
    return { peaks:out.map(function(p){ return Math.round(Math.min(1,p/max)*100)/100; }),
             duration:dec.duration };
  }catch(e){ return {peaks:[],duration:0}; }
}
async function attachFile(song, ver, file, quiet){
  if(!isAudioFile(file)){
    toast("Audio files only — "+extOf(file.name).toUpperCase()+" isn't supported");
    return false;
  }
  if(files[ver.id]) URL.revokeObjectURL(files[ver.id].url);
  const ext=extOf(file.name);
  files[ver.id]={ url:URL.createObjectURL(file), name:file.name, ext:ext,
                  type:file.type||MIME[ext]||"", size:file.size };
  ver.fileName=file.name;
  ver.format=ext;
  const specs=await readSpecs(file);
  if(specs.sampleRate) ver.sampleRate=specs.sampleRate;
  if(specs.bitDepth) ver.bitDepth=specs.bitDepth;
  if(specs.channels) ver.channels=specs.channels;
  /* Decoding gives us the waveform AND the buffer the fallback engine needs. */
  const info=await makePeaks(file, ver.id);
  if(info.peaks.length) ver.peaks=info.peaks;
  if(info.duration) ver.duration=info.duration;
  touch(song); await save();
  if(!quiet){ playVersion(song.id, ver.id); }
  return true;
}
function detachFile(ver){
  if(files[ver.id]){ URL.revokeObjectURL(files[ver.id].url); delete files[ver.id]; }
  delete buffers[ver.id];
  if(player.verId===ver.id) stopPlayer();
}
/* Reconnect: match a batch of picked files to saved versions by filename. */
async function reconnectBatch(fileList){
  const want=missingAudio();
  if(!want.length){ toast("Nothing waiting to reconnect"); return; }
  let hit=0; const leftovers=[];
  for(const file of fileList){
    if(!isAudioFile(file)){ leftovers.push(file.name); continue; }
    let target=null;
    for(const x of want){
      if(files[x.ver.id]) continue;
      if(x.ver.fileName.toLowerCase()===file.name.toLowerCase()){ target=x; break; }
    }
    if(target){ await attachFile(target.song, target.ver, file, true); hit++; }
    else leftovers.push(file.name);
  }
  await save(); renderAll();
  if(openId) renderSheet();
  toast(hit ? "Reconnected "+hit+" file"+(hit>1?"s":"")+
        (leftovers.length?" \u00B7 "+leftovers.length+" unmatched":"")+
        " \u00B7 all notes intact"
      : "No filenames matched — link them manually on each version");
}

/* ---------- transport -------------------------------------------------
   Two engines behind one interface:
     "element"  HTMLAudioElement — used whenever the browser can play the format
     "buffer"   Web Audio AudioBufferSourceNode — fallback for AIFF/FLAC, which
                Chrome can decode but refuses to play through <audio>
   There is no video element anywhere in Ivan OS.
   --------------------------------------------------------------------- */
const BE = { src:null, gain:null, startedAt:0, offset:0, dur:0 };

function canElementPlay(f){
  const t=f.type||MIME[f.ext]||"";
  if(!t) return false;
  const verdict=au.canPlayType(t);
  return verdict==="probably"||verdict==="maybe";
}
function ensureCtx(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function tDuration(){
  if(player.engine==="buffer") return BE.dur||0;
  return isFinite(au.duration)?au.duration:0;
}
function tTime(){
  if(player.engine==="buffer"){
    if(!player.playing) return BE.offset;
    return Math.min(BE.dur, BE.offset + (actx.currentTime-BE.startedAt)*player.rate);
  }
  return au.currentTime||0;
}
function beStop(){
  if(BE.src){ try{ BE.src.onended=null; BE.src.stop(); }catch(e){} BE.src=null; }
}
function beStart(from){
  const ctx=ensureCtx();
  beStop();
  const buf=buffers[player.verId];
  if(!buf) return false;
  BE.gain=BE.gain||ctx.createGain();
  BE.gain.gain.value=player.volume;
  try{ BE.gain.disconnect(); }catch(e){}
  BE.gain.connect(ctx.destination);
  const src=ctx.createBufferSource();
  src.buffer=buf;
  src.playbackRate.value=player.rate;
  src.connect(BE.gain);
  src.onended=function(){
    if(player.engine==="buffer" && player.playing && tTime()>=BE.dur-0.05){
      player.playing=false; BE.offset=0; renderTransports();
    }
  };
  BE.offset=Math.max(0,Math.min(from,buf.duration-0.02));
  BE.dur=buf.duration;
  BE.startedAt=ctx.currentTime;
  src.start(0, BE.offset);
  BE.src=src;
  return true;
}
function tPlay(){
  if(player.engine==="buffer"){
    if(!beStart(BE.offset)) return;
    player.playing=true;
  } else {
    au.playbackRate=player.rate;
    au.volume=player.volume;
    au.play().catch(function(){ fallbackToBuffer(); });
    return;
  }
  document.body.classList.add("playing");
  renderTransports(); paint();
}
function tPause(){
  if(player.engine==="buffer"){
    BE.offset=tTime(); beStop(); player.playing=false; renderTransports();
  } else au.pause();
}
function tStop(){
  if(player.engine==="buffer"){
    beStop(); BE.offset=0; player.playing=false;
  } else { au.pause(); try{ au.currentTime=0; }catch(e){} }
  player.playing=false;
  renderTransports(); paintOnce();
}
function tSeek(frac){
  const d=tDuration(); if(!d) return;
  const t=Math.max(0,Math.min(d-0.02,frac*d));
  if(player.engine==="buffer"){
    if(player.playing) beStart(t); else BE.offset=t;
  } else { try{ au.currentTime=t; }catch(e){} }
  paintOnce();
}
function tVolume(v){
  player.volume=v;
  au.volume=v;
  if(BE.gain) BE.gain.gain.value=v;
}
function tRate(r){
  player.rate=r;
  if(player.engine==="buffer"){
    if(player.playing) beStart(tTime()); else renderTransports();
  } else { au.playbackRate=r; renderTransports(); }
}
function fallbackToBuffer(){
  if(!buffers[player.verId]){
    toast("This browser can't play "+(files[player.verId]?files[player.verId].ext.toUpperCase():"that format"));
    return;
  }
  au.pause(); au.removeAttribute("src"); au.load();
  player.engine="buffer";
  BE.offset=0;
  toast("Playing through Web Audio — this browser won't take "+files[player.verId].ext.toUpperCase()+" directly");
  tPlay();
}
function playVersion(songId, verId){
  const s=byId(songId); if(!s) return;
  const v=verById(s,verId); if(!v) return;
  const f=files[verId];
  if(!f){
    pendingVer=verId;
    toast(v.fileName ? "Reconnect \u201C"+v.fileName+"\u201D to play" : "Attach an audio file to play this version");
    document.getElementById("filepick").click();
    return;
  }
  if(player.verId===verId){ player.playing?tPause():tPlay(); return; }
  /* switching versions */
  beStop(); au.pause();
  player.songId=songId; player.verId=verId; player.playing=false;
  BE.offset=0;
  if(canElementPlay(f)){
    player.engine="element";
    au.src=f.url;
    au.playbackRate=player.rate;
    au.volume=player.volume;
    au.play().catch(function(){ fallbackToBuffer(); });
  } else if(buffers[verId]){
    player.engine="buffer";
    BE.dur=buffers[verId].duration;
    tPlay();
  } else {
    toast("Can't play "+f.ext.toUpperCase()+" in this browser");
    return;
  }
  renderTransports();
}
au.onplay=function(){
  if(player.engine!=="element") return;
  player.playing=true; document.body.classList.add("playing"); renderTransports(); paint();
};
au.onpause=function(){ if(player.engine==="element"){ player.playing=false; renderTransports(); } };
au.onended=function(){ if(player.engine==="element"){ player.playing=false; renderTransports(); } };
au.ontimeupdate=paintOnce;
au.onerror=function(){ if(player.engine==="element"&&player.verId) fallbackToBuffer(); };
au.onloadedmetadata=function(){
  const s=byId(player.songId); if(!s) return;
  const v=verById(s,player.verId);
  if(v&&isFinite(au.duration)&&Math.abs((v.duration||0)-au.duration)>1){ v.duration=au.duration; queueSave(); }
  paintOnce();
};
function stopPlayer(){
  beStop(); au.pause(); au.removeAttribute("src"); au.load();
  player.songId=null; player.verId=null; player.playing=false;
  player.engine="element"; BE.offset=0;
  document.body.classList.remove("playing");
  renderTransports();
}
function stepVersion(dir){
  const s=byId(player.songId); if(!s) return;
  const loaded=s.audio.filter(function(v){ return files[v.id]; });
  if(!loaded.length) return;
  let i=-1; for(let k=0;k<loaded.length;k++) if(loaded[k].id===player.verId) i=k;
  playVersion(s.id, loaded[(i+dir+loaded.length)%loaded.length].id);
}

/* ============ 5  PLAYER ============ */
function waveHTML(v){
  const p=(v.peaks&&v.peaks.length)?v.peaks:null;
  if(!p) return '<div class="wave flat"></div>';
  return '<div class="wave">'+p.map(function(h){
    return '<u style="height:'+Math.max(6,Math.round(h*100))+'%"></u>'; }).join("")+'</div>';
}
/* One markup generator, used by the docked bar and the in-song player. */
function transportHTML(s, v, full){
  const f=files[v.id]||{};
  const spec=[ v.format&&v.format.toUpperCase(),
               v.sampleRate&&(v.sampleRate/1000)+"kHz",
               v.bitDepth&&v.bitDepth+"bit",
               player.engine==="buffer"&&"Web Audio" ].filter(Boolean).join(" \u00B7 ");
  return ''+
  (full
    ? '<div class="tp-head"><div><div class="label">Now playing</div>'+
      '<h5 class="serif">'+esc(v.name)+'</h5></div>'+
      '<button class="tp-stop" aria-label="Stop">\u25A0 Stop</button></div>'
    : '<div class="pl-top"><h6>'+esc(s.title)+'</h6><span>'+esc(v.name)+'</span>'+
      '<button class="pl-close tp-close" aria-label="Close">\u00D7</button></div>')+
  '<div class="pl-mid"><button class="pl-play tp-play" aria-label="Play or pause">'+
    (player.playing?"\u2016":"\u25B6")+'</button>'+
    '<div class="pl-wave tp-wave">'+waveHTML(v)+'</div>'+
    '<span class="pl-time tp-time">0:00</span></div>'+
  '<div class="pl-bot"><button class="tp-prev">\u2190 Prev</button>'+
    '<input type="range" class="slider vol tp-vol" min="0" max="100" value="'+
      Math.round(player.volume*100)+'" aria-label="Volume">'+
    '<button class="tp-next">Next \u2192</button></div>'+
  (full
    ? '<div class="tp-foot">'+
      '<span class="tp-file">'+esc(f.name||v.fileName||"No file")+'</span>'+
      '<span class="tp-spec">'+esc(spec)+'</span>'+
      '<span class="tp-rates">'+RATES.map(function(r){
        return '<button class="tp-rate'+(player.rate===r?" on":"")+'" data-rate="'+r+'">'+r+'\u00D7</button>';
      }).join("")+'</span></div>'
    : '');
}
function wireTransport(root, s, v){
  const q=function(sel){ return root.querySelector(sel); };
  const play=q(".tp-play"); if(play) play.onclick=function(){ player.playing?tPause():tPlay(); };
  const stop=q(".tp-stop"); if(stop) stop.onclick=tStop;
  const close=q(".tp-close"); if(close) close.onclick=stopPlayer;
  const prev=q(".tp-prev"); if(prev) prev.onclick=function(){ stepVersion(-1); };
  const next=q(".tp-next"); if(next) next.onclick=function(){ stepVersion(1); };
  const vol=q(".tp-vol"); if(vol) vol.oninput=function(e){ tVolume(Number(e.target.value)/100); };
  root.querySelectorAll(".tp-rate").forEach(function(b){
    b.onclick=function(){ tRate(Number(b.dataset.rate)); };
  });
  const w=q(".tp-wave .wave");
  if(w){
    const seek=function(e){
      const r=w.getBoundingClientRect();
      tSeek(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)));
    };
    w.onpointerdown=function(e){
      seek(e);
      const mv=function(ev){ seek(ev); };
      const up=function(){ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); };
      window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
    };
  }
}
function renderTransports(){
  const el=document.getElementById("player");
  const s=byId(player.songId), v=s?verById(s,player.verId):null;
  if(!s||!v){
    el.className="player"; el.innerHTML="";
    document.body.classList.remove("playing");
  } else {
    el.className="player on"; document.body.classList.add("playing");
    el.innerHTML=transportHTML(s,v,false);
    wireTransport(el,s,v);
  }
  /* the in-song player, when that song's Audio tab is open */
  const inline=document.getElementById("inlinePlayer");
  if(inline){
    if(s&&v&&openId===s.id){
      inline.className="transport on";
      inline.innerHTML=transportHTML(s,v,true);
      wireTransport(inline,s,v);
    } else {
      inline.className="transport";
      inline.innerHTML='<p class="hint" style="margin:0">Nothing loaded. Tap a version below to play it.</p>';
    }
  }
  paintOnce();
}
/* kept as an alias so existing call sites elsewhere in the app still work */
function renderPlayer(){ renderTransports(); }
let lastIdx=-1;
function paintOnce(){
  const dur=tDuration(), cur=tTime();
  const label=clock(cur)+(dur?" / "+clock(dur):"");
  document.querySelectorAll(".tp-time").forEach(function(t){ t.textContent=label; });
  const frac=dur>0?cur/dur:0;
  document.querySelectorAll(".tp-wave").forEach(function(wrap){
    const bars=wrap.querySelectorAll(".wave u");
    if(!bars.length) return;
    const idx=Math.floor(frac*bars.length);
    if(wrap._idx===idx) return;
    wrap._idx=idx;
    for(let i=0;i<bars.length;i++) bars[i].className=i<=idx?"on":"";
  });
}
function paint(){ if(!player.playing) return; paintOnce(); requestAnimationFrame(paint); }

/* ============ 6  INTELLIGENCE (all computed locally) ============ */

/* ---------------------------------------------------------------------------
   6a  MUSIC THEORY ENGINE
   Everything here is derived, not looked up: scales come from interval
   formulas, chords from stacked scale degrees, and guitar shapes from a
   constraint search over the fretboard. No chord database to fall out of date.
   --------------------------------------------------------------------------- */
const SHARPS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLATNM=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const SCALES={
  "Major":[0,2,4,5,7,9,11], "Natural minor":[0,2,3,5,7,8,10],
  "Harmonic minor":[0,2,3,5,7,8,11], "Melodic minor":[0,2,3,5,7,9,11],
  "Dorian":[0,2,3,5,7,9,10], "Phrygian":[0,1,3,5,7,8,10],
  "Lydian":[0,2,4,6,7,9,11], "Mixolydian":[0,2,4,5,7,9,10],
  "Locrian":[0,1,3,5,6,8,10],
  "Major pentatonic":[0,2,4,7,9], "Minor pentatonic":[0,3,5,7,10], "Blues":[0,3,5,6,7,10]
};
const CHORDS={
  "":[0,4,7], "m":[0,3,7], "dim":[0,3,6], "aug":[0,4,8],
  "sus2":[0,2,7], "sus4":[0,5,7], "5":[0,7],
  "6":[0,4,7,9], "m6":[0,3,7,9],
  "7":[0,4,7,10], "maj7":[0,4,7,11], "m7":[0,3,7,10],
  "m7b5":[0,3,6,10], "dim7":[0,3,6,9], "mMaj7":[0,3,7,11],
  "add9":[0,4,7,2], "9":[0,4,7,10,2], "maj9":[0,4,7,11,2], "m9":[0,3,7,10,2],
  "7sus4":[0,5,7,10], "7b9":[0,4,7,10,1], "7#9":[0,4,7,10,3], "13":[0,4,7,10,9]
};
const CHORD_LABEL={ "":"major","m":"minor","dim":"diminished","aug":"augmented",
  "sus2":"suspended 2nd","sus4":"suspended 4th","5":"power chord","6":"major 6th",
  "m6":"minor 6th","7":"dominant 7th","maj7":"major 7th","m7":"minor 7th",
  "m7b5":"half-diminished","dim7":"diminished 7th","mMaj7":"minor-major 7th",
  "add9":"added 9th","9":"dominant 9th","maj9":"major 9th","m9":"minor 9th",
  "7sus4":"dominant 7 sus4","7b9":"dominant 7 flat 9","7#9":"dominant 7 sharp 9","13":"13th" };
const ROMAN=["I","II","III","IV","V","VI","VII"];
const SECTIONS=["Intro","Verse","Pre-Chorus","Chorus","Bridge","Solo","Outro"];

function noteToPc(n){
  if(!n) return -1;
  const m=String(n).trim().match(/^([A-Ga-g])([#b♯♭]*)/);
  if(!m) return -1;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
  let acc=0;
  for(const c of m[2]){ if(c==="#"||c==="♯") acc++; if(c==="b"||c==="♭") acc--; }
  return ((base+acc)%12+12)%12;
}
function pcToNote(pc, flat){ return (flat?FLATNM:SHARPS)[((pc%12)+12)%12]; }
/* Key signatures that read better in flats */
const FLAT_KEYS=new Set(["F","Bb","Eb","Ab","Db","Gb","Dm","Gm","Cm","Fm","Bbm","Ebm"]);
function useFlats(root, mode){
  const n=pcToNote(root,true);
  return FLAT_KEYS.has(n)||FLAT_KEYS.has(n+"m")||/minor|Phrygian|Locrian/.test(mode||"");
}
function parseChord(sym){
  if(!sym) return null;
  const s=String(sym).trim();
  const m=s.match(/^([A-Ga-g][#b♯♭]?)(.*)$/);
  if(!m) return null;
  const root=noteToPc(m[1]);
  if(root<0) return null;
  let q=(m[2]||"").trim();
  /* slash chords: keep the bass note but analyse the upper structure */
  let bass=null;
  const slash=q.split("/");
  if(slash.length>1){ q=slash[0]; bass=noteToPc(slash[1]); }
  q=q.replace(/^maj$/i,"").replace(/^major$/i,"")
     .replace(/^min$/i,"m").replace(/^minor$/i,"m").replace(/^-$/,"m")
     .replace(/^M7$/,"maj7").replace(/^Δ7?$/,"maj7").replace(/^ma7$/i,"maj7")
     .replace(/^min7$/i,"m7").replace(/^\u00F87?$/,"m7b5").replace(/^ø7?$/,"m7b5")
     .replace(/^o7$/i,"dim7").replace(/^°7$/,"dim7").replace(/^°$/,"dim")
     .replace(/^\+$/,"aug").replace(/^sus$/i,"sus4");
  if(!(q in CHORDS)) q = q in CHORDS ? q : (CHORDS[q]?q:null);
  if(q===null||!(q in CHORDS)) return null;
  return { root:root, quality:q, bass:bass,
           name: pcToNote(root, /b/.test(m[1]))+q,
           tones: CHORDS[q].map(function(i){ return (root+i)%12; }) };
}
function parseProgression(text){
  if(!text) return [];
  return String(text).split(/[→>\-–—,|/\n]+|\s{2,}|\s+/)
    .map(function(x){ return x.trim(); })
    .filter(Boolean)
    .map(function(sym){ return { sym:sym, chord:parseChord(sym) }; });
}
function scaleNotes(rootPc, mode){
  const f=SCALES[mode]||SCALES["Major"];
  return f.map(function(i){ return (rootPc+i)%12; });
}
/* Build the diatonic chords of a key by stacking thirds within the scale. */
function diatonic(rootPc, mode, sevenths){
  const f=SCALES[mode]||SCALES["Major"];
  if(f.length!==7) return [];
  const flat=useFlats(rootPc,mode);
  const out=[];
  for(let d=0; d<7; d++){
    const idx=[0,2,4].concat(sevenths?[6]:[]);
    const tones=idx.map(function(step){
      const oct=Math.floor((d+step)/7);
      return (rootPc + f[(d+step)%7] + 12*oct)%12;
    });
    const iv=tones.map(function(t){ return ((t-tones[0])%12+12)%12; });
    let q="";
    const has=function(a){ return a.every(function(x){ return iv.indexOf(x)!==-1; }); };
    if(sevenths){
      if(has([0,4,7,11])) q="maj7";
      else if(has([0,4,7,10])) q="7";
      else if(has([0,3,7,10])) q="m7";
      else if(has([0,3,6,10])) q="m7b5";
      else if(has([0,3,6,9])) q="dim7";
      else if(has([0,3,7,11])) q="mMaj7";
      else q=has([0,3,7])?"m":"";
    } else {
      if(has([0,4,8])) q="aug";
      else if(has([0,3,6])) q="dim";
      else if(has([0,3,7])) q="m";
      else q="";
    }
    let rn=ROMAN[d];
    if(q==="m"||q==="m7"||q==="mMaj7") rn=rn.toLowerCase();
    if(q==="dim"||q==="m7b5"||q==="dim7") rn=rn.toLowerCase()+"\u00B0";
    if(q==="aug") rn=rn+"+";
    if(sevenths&&q!=="dim7") rn+= (q==="maj7"?"maj7":"7");
    out.push({ pc:tones[0], quality:q, roman:rn, degree:d,
               name:pcToNote(tones[0],flat)+q, tones:tones });
  }
  return out;
}
function romanOf(chord, rootPc, mode){
  if(!chord) return "";
  const dia=diatonic(rootPc,mode,false);
  for(const d of dia){
    if(d.pc===chord.root){
      const triadMatch = (d.quality==="m") === (chord.quality.indexOf("m")===0 && chord.quality!=="maj7");
      let rn=d.roman;
      if(/7$/.test(chord.quality)&&chord.quality!=="dim7") rn+="7";
      return triadMatch?rn:rn+"*";
    }
  }
  /* not diatonic — describe it by interval from the tonic */
  const iv=((chord.root-rootPc)%12+12)%12;
  const names={1:"\u266DII",2:"II",3:"\u266DIII",4:"III",5:"IV",6:"\u266DV",
               7:"V",8:"\u266DVI",9:"VI",10:"\u266DVII",11:"VII"};
  let rn=names[iv]||"?";
  if(chord.quality.indexOf("m")===0&&chord.quality!=="maj7") rn=rn.toLowerCase();
  return rn;
}
function inKey(chord, rootPc, mode){
  if(!chord) return false;
  const sc=scaleNotes(rootPc,mode);
  return chord.tones.every(function(t){ return sc.indexOf(t)!==-1; });
}
/* Chords borrowed from the parallel mode — the most common colour outside a key. */
function borrowed(rootPc, mode){
  const isMajor=/Major|Lydian|Mixolydian/.test(mode);
  const par=isMajor?"Natural minor":"Major";
  const here=diatonic(rootPc,mode,false).map(function(d){ return d.pc+"|"+d.quality; });
  return diatonic(rootPc,par,false)
    .filter(function(d){ return here.indexOf(d.pc+"|"+d.quality)===-1; })
    .map(function(d){
      d.from=par.toLowerCase();
      d.why="Borrowed from the parallel "+par.toLowerCase()+" \u2014 same tonic, different colour.";
      return d;
    });
}
/* Secondary dominants: the V7 of each diatonic chord except the tonic. */
function secondaryDominants(rootPc, mode){
  const dia=diatonic(rootPc,mode,false);
  const out=[];
  dia.forEach(function(d,i){
    if(i===0) return;
    if(d.quality==="dim") return;
    const vpc=(d.pc+7)%12;
    out.push({ pc:vpc, quality:"7", name:pcToNote(vpc,useFlats(rootPc,mode))+"7",
      roman:"V7/"+d.roman, target:d.name,
      why:"Pulls hard into "+d.name+". Borrowed tension that resolves inside the key." });
  });
  return out;
}
function substitutions(rootPc, mode){
  const dia=diatonic(rootPc,mode,false);
  const flat=useFlats(rootPc,mode);
  const V=dia[4], IV=dia[3], vi=dia[5], I=dia[0];
  const out=[];
  if(V) out.push({ name:pcToNote((V.pc+6)%12,flat)+"7", roman:"\u266DII7",
    why:"Tritone substitution for "+V.name+". Same tension, chromatic bass walking down to the tonic." });

/* ---- guitar voicings by constraint search over the fretboard ---- */
const TUNINGS={ "Standard":[4,9,2,7,11,4], "Drop D":[2,9,2,7,11,4],
  "Half step down":[3,8,1,6,10,3], "DADGAD":[2,9,2,7,9,2], "Open D":[2,9,2,6,9,2],
  "Open G":[2,7,2,7,11,2] };
function tuningFor(name){
  if(!name) return TUNINGS["Standard"];
  const k=Object.keys(TUNINGS).find(function(t){
    return String(name).toLowerCase().indexOf(t.toLowerCase())!==-1; });
  return TUNINGS[k]||TUNINGS["Standard"];

const voiceCache={};
function guitarVoicings(chord, tuningName, limit){
  if(!chord) return [];
  const key=chord.root+"|"+chord.quality+"|"+(tuningName||"Standard");
  if(voiceCache[key]) return voiceCache[key].slice(0,limit||3);
  const open=tuningFor(tuningName);
  const tones=chord.tones;
  const results=[];
  for(let base=0; base<=11; base++){
    /* candidate frets per string: mute, open, or one fret inside a 4-fret window */
    const cand=open.map(function(o){
      const list=[-1];
      if(tones.indexOf(o%12)!==-1) list.push(0);
      for(let f=Math.max(base,1); f<base+4; f++){
        if(tones.indexOf((o+f)%12)!==-1){ list.push(f); break; }
      }
      for(let f=base+3; f>=Math.max(base,1); f--){
        if(tones.indexOf((o+f)%12)!==-1 && list.indexOf(f)===-1){ list.push(f); break; }
      }
      return list;
    });
    const combo=new Array(6);
    (function walk(i){
      if(results.length>400) return;
      if(i===6){
        const played=[];
        for(let s=0;s<6;s++) if(combo[s]>=0) played.push(s);
        if(played.length<4) return;
        /* no muted string sandwiched between sounding strings */
        for(let s=played[0]; s<played[played.length-1]; s++) if(combo[s]<0) return;
        const pcs=played.map(function(s){ return (open[s]+combo[s])%12; });
        for(const t of tones) if(pcs.indexOf(t)===-1) return;
        if((open[played[0]]+combo[played[0]])%12 !== chord.root) return;
        const fretted=played.map(function(s){ return combo[s]; }).filter(function(f){ return f>0; });
        const span=fretted.length?Math.max.apply(null,fretted)-Math.min.apply(null,fretted):0;
        if(span>3) return;
        const lo=fretted.length?Math.min.apply(null,fretted):0;
        const opens=played.filter(function(s){ return combo[s]===0; }).length;
        const barre=fretted.length>=3 && fretted.filter(function(f){ return f===lo; }).length>=3;
        results.push({ frets:combo.slice(), played:played.length, opens:opens,
          span:span, low:lo, barre:barre,
          score: played.length*3 + opens*2.5 - lo*0.6 - span*1.2 - (barre?1.5:0) });
        return;
      }
      for(const f of cand[i]){ combo[i]=f; walk(i+1); }
    })(0);
  }
  results.sort(function(a,b){ return b.score-a.score; });

  const seen={}, uniq=[];
  for(const r of results){
    const k=r.frets.join(",");
    if(seen[k]) continue;
    seen[k]=1; uniq.push(r);
    if(uniq.length>=6) break;
  }
  uniq.forEach(function(r){
    r.difficulty = (r.opens>=2&&!r.barre&&r.span<=2) ? "Easy"
                 : (r.barre||r.span>=3) ? "Hard" : "Medium";

}
function fretSVG(v, w){
  if(!v) return '<p class="hint" style="margin:0">No playable shape found in this tuning.</p>';
  const W=w||96, H=W*1.18, L=W*0.16, R=W*0.9, top=H*0.2, bot=H*0.94;
  const cols=5, sw=(R-L)/5, fh=(bot-top)/cols;
  const startFret = v.low>1 ? v.low : 1;
  let s='<svg class="fret" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
  for(let i=0;i<6;i++){ const x=L+i*sw; s+='<line x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+bot+'"/>'; }
  for(let f=0;f<=cols;f++){
    const y=top+f*fh;
    s+='<line class="'+(f===0&&startFret===1?"nut":"")+'" x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'"/>';
  }
  if(startFret>1) s+='<text x="'+(R+3)+'" y="'+(top+fh*0.75)+'">'+startFret+'</text>';
  if(v.barre){
    const bs=v.played, xs=[];
    for(let i=0;i<6;i++) if(v.frets[i]===v.low) xs.push(i);
    if(xs.length>=3){
      const y=top+(v.low-startFret+0.5)*fh;
      s+='<rect class="barre" x="'+(L+xs[0]*sw-3)+'" y="'+(y-3)+'" width="'+
        ((xs[xs.length-1]-xs[0])*sw+6)+'" height="6" rx="3"/>';
    }
  }
  for(let i=0;i<6;i++){
    const x=L+i*sw, f=v.frets[i];
    if(f<0){ s+='<text x="'+(x-2.5)+'" y="'+(top-4)+'">\u00D7</text>'; }
    else if(f===0){ s+='<text x="'+(x-2.5)+'" y="'+(top-4)+'">\u25CB</text>'; }
    else {
      const y=top+(f-startFret+0.5)*fh;

    }
  }

}
function pianoSVG(tones, w){
  const W=w||140, H=W*0.44, n=14, kw=W/n;
  const whitePcs=[0,2,4,5,7,9,11];
  let s='<svg class="keys" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
  for(let i=0;i<n;i++){
    const pc=whitePcs[i%7];
    const on=tones.indexOf(pc)!==-1;
    s+='<rect class="w'+(on?" on":"")+'" x="'+(i*kw)+'" y="0" width="'+kw+'" height="'+H+'" rx="1.5"/>';
  }
  const blackAfter=[0,1,3,4,5];
  for(let i=0;i<n;i++){
    const idx=i%7;
    if(blackAfter.indexOf(idx)===-1) continue;
    const pc=(whitePcs[idx]+1)%12;

    s+='<rect class="b'+(on?" on":"")+'" x="'+(i*kw+kw*0.66)+'" y="0" width="'+(kw*0.66)+
       '" height="'+(H*0.6)+'" rx="1.5"/>';

}

/* How close is this song to anything else in the catalogue? */
function similarTo(song){
  const mine=songProgressions(song).map(function(p){ return romanSequence(song,p).join(" "); })
    .filter(function(x){ return x.replace(/\?|\s/g,"").length; });
  const out=[];
  state.songs.forEach(function(o){
    if(o.id===song.id||o.archived) return;
    const reasons=[]; let sc=0;
    if(song.songkey&&o.songkey&&song.songkey.toLowerCase()===o.songkey.toLowerCase()){
      sc+=22; reasons.push("same key ("+o.songkey+")");
    }
    if(song.scale&&o.scale&&song.scale===o.scale){ sc+=8; reasons.push("same mode"); }
    const b1=Number(song.bpm), b2=Number(o.bpm);
    if(b1&&b2&&Math.abs(b1-b2)<=6){ sc+=16; reasons.push("within "+Math.abs(b1-b2)+" BPM"); }
    if(song.structure&&o.structure&&song.structure.trim()===o.structure.trim()){
      sc+=14; reasons.push("identical structure");
    }
    if(song.tuning&&o.tuning&&song.tuning===o.tuning){ sc+=5; }
    const theirs=songProgressions(o).map(function(p){ return romanSequence(o,p).join(" "); });
    let best=null;
    mine.forEach(function(a){
      theirs.forEach(function(b){
        if(!a||!b) return;
        if(a===b){ if(!best||best.kind!=="exact"){ best={kind:"exact",seq:a}; } return; }
        const A=a.split(" "), B=b.split(" ");
        const shared=A.filter(function(x){ return B.indexOf(x)!==-1; }).length;
        const ratio=shared/Math.max(A.length,B.length);
        if(ratio>=0.75&&(!best||best.kind==="partial"&&ratio>best.ratio))
          best={kind:"partial",seq:a,ratio:ratio};
      });
    });
    if(best){
      if(best.kind==="exact"){ sc+=45; reasons.push("the same progression \u2014 "+best.seq); }
      else { sc+=26; reasons.push("a near-identical progression ("+Math.round(best.ratio*100)+"% shared)"); }
    }
    if(sc>=30) out.push({ song:o, score:Math.min(99,sc), reasons:reasons });
  });
  return out.sort(function(a,b){ return b.score-a.score; }).slice(0,4);
}

/* ---------------------------------------------------------------------------

   held briefly so Undo can put it back in the same album position.
   --------------------------------------------------------------------------- */
function deleteSong(id){
  const i=state.songs.findIndex(function(x){ return x.id===id; });
  if(i<0){ toast("That song no longer exists"); return false; }
  const song=state.songs[i];
  const snapshot={
    song: JSON.parse(JSON.stringify(song)),
    index: i,
    albumIndex: state.album.tracks.indexOf(id),
    wasFocus: state.focusId===id
  };
  song.audio.forEach(detachFile);
  if(player.songId===id) stopPlayer();
  state.songs.splice(i,1);
  const ai=state.album.tracks.indexOf(id);
  if(ai>=0) state.album.tracks.splice(ai,1);
  if(state.focusId===id) state.focusId=null;
  save(); renderAll();
  toastAction("\u201C"+snapshot.song.title+"\u201D deleted", "Undo", function(){
    state.songs.splice(Math.min(snapshot.index,state.songs.length),0,blank(snapshot.song));
    if(snapshot.albumIndex>=0)
      state.album.tracks.splice(Math.min(snapshot.albumIndex,state.album.tracks.length),0,snapshot.song.id);
    if(snapshot.wasFocus) state.focusId=snapshot.song.id;
    save(); renderAll();

  return true;
}
