      ws.forEach(function(w){
        if(LEX.image.indexOf(w)!==-1) sc+=3;
        if(LEX.warm.indexOf(w)!==-1||LEX.dark.indexOf(w)!==-1||LEX.blue.indexOf(w)!==-1) sc+=1;
      });
      const rare=ws.filter(function(w){ return tally(allWords).slice(0,15)
        .every(function(t){ return t.k!==w; }); }).length;
      sc += rare*0.6 + (ws.length>=5&&ws.length<=9?2:0);
      if(sc>2) scored.push({line:l, song:ps.song.title, score:sc});
    });
  });
  scored.sort(function(a,b){ return b.score-a.score; });
  return {
    strongest: scored.slice(0,5),
    songs:L.length, totalWords:allWords.length, unique:uniq.size,
    variety: allWords.length ? Math.round(uniq.size/allWords.length*100) : 0,
    topWords: tally(allWords).slice(0,10),
    phrases: tally(bigrams).filter(function(x){ return x.n>1; }).slice(0,8),
    avgLine: avgLine,
    rhyme: pairs ? Math.round(rhymes/pairs*100) : 0,
    tone: tone, perSong: perSong
  };
}
function albumIntel(){
  const t=state.album.tracks.map(byId).filter(Boolean);
  if(!t.length) return null;
  const bpms=t.map(function(s){ return Number(s.bpm)||0; }).filter(Boolean);
  const spread = bpms.length>1 ? Math.max.apply(null,bpms)-Math.min.apply(null,bpms) : 0;
  return {
    tracks:t,
    avg: Math.round(t.reduce(function(a,s){ return a+progressOf(s); },0)/t.length),
    done: t.filter(isDone).length,
    keys: tally(t.map(function(s){ return s.songkey; })),
    genres: tally(t.map(function(s){ return s.genre; })),
    emotions: tally(t.map(function(s){ return s.emotion1; })),
    bpmSpread: spread,
    bpmAvg: bpms.length?Math.round(bpms.reduce(function(a,b){ return a+b; },0)/bpms.length):0,
    noAudio: t.filter(function(s){ return !s.audio.length; }),
    noLyrics: t.filter(function(s){ return !lyricText(s); }),
    weak: t.filter(function(s){ return progressOf(s)<40; })
  };
}
function score(s){
  let v=s.priority*22 + progressOf(s)*0.4;
  if(s.nextAction) v+=14;
  if(state.album.tracks.indexOf(s.id)!==-1) v+=10;
  const d=daysSince(s.updated);
  if(d>=STALE) v+=12;
  if(d>=DORMANT) v-=8;
  if(state.focusId===s.id) v+=18;
  return v;
}
function blocker(s){
  const open=s.tasks.filter(function(t){ return !t.done; });
  if(!s.nextAction&&!open.length) return "no next action and no tasks — nothing tells you where to restart";
  if(!s.nextAction) return "no next action set, but "+open.length+" task"+(open.length>1?"s":"")+" waiting";
  if(!s.audio.length&&s.stage>=4) return "at "+LIFE[s.stage][0]+" with no audio version logged";
  if(!lyricText(s)&&s.stage>=2) return "at "+LIFE[s.stage][0]+" with no lyrics written";
  return "next action is \u201C"+s.nextAction+"\u201D — it just hasn't been done";
}
function gearNames(cat){
  return state.gear.filter(function(g){ return g.category===cat; }).map(function(g){ return g.name; });
}
function softNames(){ return state.software.map(function(g){ return g.name; }); }

const QUESTIONS=[
  ["today","What should I work on today?"],
  ["closest","Which songs are closest to finished?"],
  ["stuck","Where am I losing momentum?"],
  ["album","What does the album need?"],
  ["gear","What should I use from my own setup?"],
  ["harmony","What are my harmonic habits?"],
  ["repeat","Where am I repeating myself?"],
  ["state","What's the state of the studio?"]
];
function analyse(kind){
  const L=live().filter(function(s){ return !isDone(s); });
  if(!L.length && kind!=="gear" && kind!=="state")
    return {title:"Nothing open", lines:[{mark:"\u2014",html:"Every song is finished or archived. Time to start something new."}]};

  if(kind==="today"){
    const r=L.slice().sort(function(a,b){ return score(b)-score(a); });
    const s=r[0], open=s.tasks.filter(function(t){ return !t.done; });
    const why=[];
    if(state.focusId===s.id) why.push("it's your pinned focus");
    if(s.priority===2) why.push("you marked it high priority");
    if(progressOf(s)>=60) why.push("it's already "+progressOf(s)+"% through the lifecycle");
    if(daysSince(s.updated)>=STALE) why.push("it's been sitting for "+daysSince(s.updated)+" days");
    if(state.album.tracks.indexOf(s.id)!==-1) why.push("it's on the album");
    if(!why.length) why.push("it's the furthest along of what's open");
    const lines=[
      {mark:"\u25B8",html:"<b>"+esc(s.title)+"</b> — "+LIFE[s.stage][0]+", "+progressOf(s)+"%"},
      {mark:"\u2192",html:s.nextAction?"Next action: <b>"+esc(s.nextAction)+"</b>"
        :"No next action set. Decide one before you start — that's the blocker."}
    ];
    if(open.length) lines.push({mark:"\u2611",html:open.length+" open task"+(open.length>1?"s":"")+
      ", starting with <b>"+esc(open[0].text)+"</b>"});
    if(s.estimate) lines.push({mark:"\u25F7",html:"You estimated "+esc(s.estimate)});
    lines.push({mark:"\u2691",html:"Why this one: "+why.join(", ")+"."});
    if(r[1]) lines.push({mark:"\u00B7",html:"Runner-up: "+esc(r[1].title)+" ("+progressOf(r[1])+"%)"});
    return {title:"Work on "+s.title, lines:lines, songId:s.id};
  }

  if(kind==="closest"){
    const r=L.slice().sort(function(a,b){ return b.stage-a.stage; }).slice(0,5);
    return {title:"Closest to the finish line", songId:r[0].id,
      lines:r.map(function(s){
        const open=s.tasks.filter(function(t){ return !t.done; }).length;
        return {mark:progressOf(s)+"%",html:"<b>"+esc(s.title)+"</b> — "+LIFE[s.stage][0]+
          (open?", "+open+" task"+(open>1?"s":"")+" left":", no open tasks")+
          (s.stage>=7?" \u2014 push this over the line":"")};
      })};
  }

  if(kind==="stuck"){
    const stuck=live().filter(function(s){ return !isDone(s)&&daysSince(s.updated)>=STALE; })
      .sort(function(a,b){ return a.updated-b.updated; }).slice(0,5);
    if(!stuck.length) return {title:"Nothing is stalling",
      lines:[{mark:"\u2713",html:"Every open song has been touched in the last "+STALE+" days. Momentum is good."}]};
    return {title:"Where you're losing momentum", songId:stuck[0].id,
      lines:stuck.map(function(s){
        return {mark:daysSince(s.updated)+"d",html:"<b>"+esc(s.title)+"</b> — "+esc(blocker(s))};
      })};
  }

  if(kind==="album"){
    const a=albumIntel();
    if(!a) return {title:"No album sequenced yet",
      lines:[{mark:"\u2014",html:"Add songs to the album to see what it needs."}]};
    const lines=[{mark:"\u25B8",html:"<b>"+esc(state.album.title)+"</b> sits at "+a.avg+"%, "+
      a.done+" of "+a.tracks.length+" past Ready to Release"}];
    if(a.weak.length) lines.push({mark:"\u26A0",html:a.weak.length+" track"+(a.weak.length>1?"s":"")+
      " under 40%: "+a.weak.slice(0,4).map(function(s){ return esc(s.title); }).join(", ")});
    if(a.noAudio.length) lines.push({mark:"\u266A",html:a.noAudio.length+" with no audio version: "+
      a.noAudio.slice(0,4).map(function(s){ return esc(s.title); }).join(", ")});
    if(a.noLyrics.length) lines.push({mark:"\u270E",html:a.noLyrics.length+" with no lyrics yet: "+
      a.noLyrics.slice(0,4).map(function(s){ return esc(s.title); }).join(", ")});
    if(a.bpmSpread && a.bpmSpread<25) lines.push({mark:"\u25F7",
      html:"Tempos only span "+a.bpmSpread+" BPM around "+a.bpmAvg+". The record may feel flat — consider one deliberately slower or faster track."});
    if(a.keys.length && a.keys[0].n>=3) lines.push({mark:"\u266D",
      html:a.keys[0].n+" tracks in <b>"+esc(a.keys[0].k)+"</b>. Cohesive, but watch for sameness across a full listen."});
    if(a.tracks.length<8) lines.push({mark:"\u00B7",html:"Only "+a.tracks.length+" tracks sequenced. Most records land between 8 and 12."});
    return {title:"What the album needs", lines:lines};
  }

  if(kind==="gear"){
    const cp=creativeProfile();
    const lines=[];
    lines.push({mark:"\u266A",html:"You own <b>"+state.gear.length+"</b> pieces of hardware and <b>"+
      state.software.length+"</b> pieces of software. Everything below is already yours."}); 
    if(cp.guitars.length) lines.push({mark:"\u25B8",html:"Most-used guitar: <b>"+esc(cp.guitars[0].k)+
      "</b> ("+cp.guitars[0].n+" songs)"+(cp.guitars.length>1?". Least used: "+esc(cp.guitars[cp.guitars.length-1].k):"")});
    if(cp.plugins.length) lines.push({mark:"\u2699",html:"Most-used plugin: <b>"+esc(cp.plugins[0].k)+
      "</b> ("+cp.plugins[0].n+" songs)"});
    const unused=state.software.filter(function(g){
      return !cp.plugins.some(function(p){ return p.k===g.name; }); });
    if(unused.length) lines.push({mark:"\u26A0",html:"Never logged on a song yet: "+
      unused.slice(0,6).map(function(g){ return esc(g.name); }).join(", ")+
      ". Before buying anything, try one of these."});
    const wanted=state.wishlist.filter(function(w){ return w.status!=="Owned"; });
    if(wanted.length) lines.push({mark:"\u2691",html:wanted.length+" item"+(wanted.length>1?"s":"")+
      " on the dream studio list, top priority: <b>"+esc(wanted[0].name)+"</b>"});
    return {title:"Use what you already own", lines:lines};
  }

  if(kind==="harmony"){
    return { title:"Your harmonic habits",
      lines:harmonicInsights().map(function(t){ return {mark:"\u266A", html:esc(t)}; }) };
  }

  if(kind==="repeat"){
    const lines=[]; const seen={};
    live().forEach(function(a){
      similarTo(a).forEach(function(m){
        const k=[a.id,m.song.id].sort().join("|");
        if(seen[k]||m.score<55) return;
        seen[k]=1;
        lines.push({mark:m.score+"%", html:"<b>"+esc(a.title)+"</b> and <b>"+esc(m.song.title)+
          "</b> share "+esc(m.reasons.join(", "))});
      });
    });
    const lp=lyricProfile();
    if(lp.phrases&&lp.phrases.length)
      lines.push({mark:"\u270E", html:"Lyrically you reuse \u201C<b>"+esc(lp.phrases[0].k)+
        "</b>\u201D across "+lp.phrases[0].n+" places."});
    if(!lines.length) lines.push({mark:"\u2713",
      html:"Nothing is treading the same ground. Your catalogue is varied in key, tempo and harmony."});
    else lines.push({mark:"\u00B7", html:"Repetition builds a signature \u2014 this is flagged so it stays deliberate."});
    return { title:"Where you repeat yourself", lines:lines };
  }

  const all=live();
  const vers=allVersions().length;
  const openTasks=all.reduce(function(a,s){ return a+s.tasks.filter(function(t){ return !t.done; }).length; },0);
  const spread=LIFE.map(function(l,i){ return all.filter(function(s){ return s.stage===i; }).length; });
  const busiest=spread.indexOf(Math.max.apply(null,spread));
  return {title:"The state of the studio", lines:[
    {mark:"\u266A",html:"<b>"+all.length+"</b> songs live, <b>"+all.filter(isDone).length+
      "</b> past Ready to Release, <b>"+vers+"</b> audio versions logged"},
    {mark:"\u25B8",html:"Most songs are sitting at <b>"+LIFE[busiest][0]+"</b> ("+spread[busiest]+")"},
    {mark:"\u2611",html:"<b>"+openTasks+"</b> open tasks across the catalogue"},
    {mark:"\u25F7",html:"<b>"+streak()+"</b> day streak, <b>"+state.sessions.length+"</b> sessions logged"},
    {mark:"\u2691",html:live().filter(isDormant).length+" songs untouched for "+DORMANT+"+ days"},
    {mark:"\u266B",html:missingAudio().length+" audio versions waiting to be reconnected"}
  ]};
}
function buildStudioBrief(){
  const L=[];
  L.push("IVAN OS — STUDIO BRIEF ("+dstamp(Date.now())+")");
  L.push("Album: "+state.album.title+(state.album.notes?" — "+state.album.notes:""));
  L.push("Streak: "+streak()+" days | Sessions: "+state.sessions.length);
  L.push("");
  L.push("MY HARDWARE (recommend from this before anything else):");
  GEAR_CATS.forEach(function(c){
    const n=gearNames(c); if(n.length) L.push("  "+c+": "+n.join(", "));
  });
  L.push("MY SOFTWARE:");
  SOFT_CATS.forEach(function(c){
    const items=state.software.filter(function(g){ return g.category===c; });
    if(!items.length) return;
    L.push("  "+c+":");
    items.forEach(function(g){
      L.push("    "+g.name+
        (g.presets?" | favourite presets: "+g.presets:"")+
        (g.uses?" | I use it for: "+g.uses:"")+
        (g.notes?" | notes: "+g.notes:""));
    });
  });
  if(state.wishlist.length){
    L.push("DREAM STUDIO (not owned yet):");
    state.wishlist.forEach(function(w){
      L.push("  "+w.name+" ("+w.category+", "+(w.price||"?")+", "+w.priority+")"+(w.why?" — "+w.why:""));
    });
  }
  const hins=harmonicInsights();
  if(hins.length){
    L.push("MY HARMONIC PATTERNS (measured from my own catalogue):");
    hins.forEach(function(x){ L.push("  - "+x); });
  }
  L.push("");
  live().forEach(function(s){
    L.push("=== "+s.title+" ===");
    L.push("Lifecycle: "+LIFE[s.stage][0]+" ("+progressOf(s)+"%) | Priority: "+PRIOS[s.priority]+
      " | Last worked: "+ago(s.updated));
    const spec=[s.bpm&&s.bpm+" BPM", s.songkey, s.timeSig, s.tuning&&"tuning "+s.tuning,
      s.capo&&"capo "+s.capo, s.genre, s.subgenre, s.mood].filter(Boolean).join(" | ");
    if(spec) L.push("Musical: "+spec);
    if(s.emotion1||s.emotion2) L.push("Emotion: "+[s.emotion1,s.emotion2].filter(Boolean).join(" / "));
    if(s.scale) L.push("Mode: "+s.scale);
    if(s.progressions&&s.progressions.length){
      L.push("Progressions:");
      s.progressions.forEach(function(p){
        if(!p.chords) return;
        const rn=romanSequence(s,p);
        L.push("  "+p.section+": "+p.chords+(rn.length?"  ["+rn.join(" ")+"]":"")+
          (p.note?"  \u2014 "+p.note:""));
      });
    }
    if(s.chords) L.push("Chords: "+s.chords);
    if(s.structure) L.push("Structure: "+s.structure);
    if(s.goal) L.push("Goal: "+s.goal);
    if(s.nextAction) L.push("Next action: "+s.nextAction);
    if(s.meaning) L.push("Meaning: "+s.meaning);
    if(s.inspiration) L.push("Inspiration: "+s.inspiration);
    const rig=[s.guitar.length&&"Guitar: "+s.guitar.join(", "),
               s.bass.length&&"Bass: "+s.bass.join(", "),
               s.mic.length&&"Mic: "+s.mic.join(", "),
               s.amp.length&&"Amp: "+s.amp.join(", "),
               s.plugins.length&&"Plugins: "+s.plugins.join(", "),
               s.effectsChain&&"Chain: "+s.effectsChain].filter(Boolean);
    if(rig.length){ L.push("Rig used:"); rig.forEach(function(x){ L.push("  "+x); }); }
    const pn=[s.prod.recording&&"Recording: "+s.prod.recording,
              s.prod.production&&"Production: "+s.prod.production,
              s.prod.mixing&&"Mixing: "+s.prod.mixing,
              s.prod.mastering&&"Mastering: "+s.prod.mastering].filter(Boolean);
    if(pn.length){ L.push("Production notes:"); pn.forEach(function(x){ L.push("  "+x); }); }
    if(s.audio.length){
      L.push("Audio versions:");
      s.audio.forEach(function(v){
        L.push("  - "+v.name+" ("+LIFE[v.status][0]+", "+dstamp(v.date)+
          (v.sampleRate?", "+(v.sampleRate/1000)+"kHz":"")+(v.bitDepth?"/"+v.bitDepth+"bit":"")+
          ")"+(v.notes?": "+v.notes:""));
      });
    }
    const lt=lyricText(s);
    if(lt){ L.push("Lyrics:"); L.push(lt); }
    if(s.favLines) L.push("Favourite lines: "+s.favLines);
    if(s.weakLines) L.push("Weak lines: "+s.weakLines);
    if(s.themes) L.push("Themes: "+s.themes);
    const open=s.tasks.filter(function(t){ return !t.done; });
    if(open.length){ L.push("Open tasks:"); open.forEach(function(t){ L.push("  [ ] "+t.text); }); }
    L.push("");
  });
  return L.join("\n");
}

function enableDrag(){
  const list=document.getElementById("tlist"); if(!list) return;
  list.querySelectorAll("[data-grip]").forEach(function(g){
    g.onpointerdown=function(e){
      e.preventDefault();
      const row=g.closest(".trow"); row.classList.add("dragging");
      try{ g.setPointerCapture(e.pointerId); }catch(err){}
      function move(ev){
        row.style.pointerEvents="none";
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        row.style.pointerEvents="";
        const over=el&&el.closest(".trow");
        if(over&&over!==row&&over.parentNode===list){
          const rows=Array.prototype.slice.call(list.querySelectorAll(".trow"));
          if(rows.indexOf(over)>rows.indexOf(row)) over.after(row); else over.before(row);
        }
      }
      function up(){
        row.classList.remove("dragging");
        g.removeEventListener("pointermove",move); g.removeEventListener("pointerup",up);
        g.removeEventListener("pointercancel",up);
        state.album.tracks=Array.prototype.slice.call(list.querySelectorAll(".trow"))
          .map(function(r){ return r.dataset.id; });
        save(); renderAlbum(); toast("Tracklist reordered");
      }
      g.addEventListener("pointermove",move); g.addEventListener("pointerup",up);
      g.addEventListener("pointercancel",up);
    };
  });
}

  const flat=useFlats(noteToPc(libRoot),"Major");
  const roots=SHARPS.map(function(n,i){ return pcToNote(i,flat); });
  const types=Object.keys(CHORDS);
  const tuning=(byId(state.focusId)||{}).tuning||"Standard";

  let list=[];
  types.forEach(function(q){
    if(libType&&q!==libType) return;
    const c=parseChord(libRoot+q);
    if(!c) return;
    const vs=libInst==="guitar"?guitarVoicings(c,tuning,1):[];
    const diff=vs.length?vs[0].difficulty:"\u2014";
    if(libDiff!=="All"&&libInst==="guitar"&&diff!==libDiff) return;
    const label=(CHORD_LABEL[q]||q);
    if(libQuery){
      const hay=(c.name+" "+label).toLowerCase();
      if(hay.indexOf(libQuery.toLowerCase())===-1) return;
    }
    list.push({chord:c, quality:q, label:label, v:vs[0], diff:diff});
  });

  body.innerHTML=
    '<div style="padding:0 24px 16px"><div class="rowadd">'+
      '<input id="lib-q" value="'+esc(libQuery)+'" placeholder="Search chords\u2026">'+
      '<button id="lib-clear">Clear</button></div></div>'+
    '<div class="filters">'+["guitar","piano"].map(function(i){
      return '<button data-li="'+i+'" aria-pressed="'+(libInst===i)+'">'+i+'</button>'; }).join("")+
      ["All","Easy","Medium","Hard"].map(function(d){
      return '<button data-ld="'+d+'" aria-pressed="'+(libDiff===d)+'">'+d+'</button>'; }).join("")+'</div>'+
    '<div class="filters">'+roots.map(function(r){
      return '<button data-lr="'+esc(r)+'" aria-pressed="'+(libRoot===r)+'">'+esc(r)+'</button>'; }).join("")+'</div>'+
    '<div class="filters">'+[["","all types"]].concat(types.map(function(q){
      return [q,(q||"maj")]; })).map(function(t){
      return '<button data-lt="'+esc(t[0])+'" aria-pressed="'+(libType===t[0])+'">'+esc(t[1])+'</button>'; }).join("")+'</div>'+
    (list.length
      ? '<div class="cgrid">'+list.map(function(x){
          const tonesTxt=x.chord.tones.map(function(t){ return pcToNote(t,flat); }).join(" \u00B7 ");
          return '<button class="ccard" data-chord="'+esc(x.chord.name)+'">'+
            '<h5>'+esc(x.chord.name)+'</h5>'+
            '<div class="cm">'+esc(x.label)+'</div>'+
            '<div class="cd">'+(libInst==="guitar"?fretSVG(x.v):pianoSVG(x.chord.tones))+'</div>'+
            '<div class="cm" style="margin-top:9px">'+esc(tonesTxt)+'</div>'+
            (libInst==="guitar"?'<span class="diff '+(x.diff==="Medium"?"med":x.diff==="Hard"?"hard":"")+'">'+
              esc(x.diff)+'</span>':'')+
            '</button>';
        }).join("")+'</div>'
      : '<div class="empty"><h2 class="serif">Nothing matches</h2><p>Try a different root, type or difficulty.</p></div>')+
    '<p class="hint" style="padding:0 24px 20px">Guitar shapes are found by searching the fretboard for '+
    'playable voicings with the root in the bass \u2014 tap a chord for variations and related chords.</p>';

  const q=document.getElementById("lib-q");
  q.oninput=function(e){ libQuery=e.target.value; renderLibrary(body); q2focus(); };
  function q2focus(){ const n=document.getElementById("lib-q"); if(n){ n.focus(); n.selectionStart=n.value.length; } }
  document.getElementById("lib-clear").onclick=function(){ libQuery=""; renderLibrary(body); };
  body.querySelectorAll("[data-li]").forEach(function(b){
    b.onclick=function(){ libInst=b.dataset.li; renderLibrary(body); }; });
  body.querySelectorAll("[data-ld]").forEach(function(b){
    b.onclick=function(){ libDiff=b.dataset.ld; renderLibrary(body); }; });
  body.querySelectorAll("[data-lr]").forEach(function(b){
    b.onclick=function(){ libRoot=b.dataset.lr; renderLibrary(body); }; });
  body.querySelectorAll("[data-lt]").forEach(function(b){
    b.onclick=function(){ libType=b.dataset.lt; renderLibrary(body); }; });
  body.querySelectorAll("[data-chord]").forEach(function(b){
    b.onclick=function(){ showChord(b.dataset.chord); }; });
}

/* full detail for one chord: every voicing, both instruments, related chords */
async function showChord(name){
  const c=parseChord(name); if(!c) return;
  const tuning=(byId(state.focusId)||{}).tuning||"Standard";
  const vs=guitarVoicings(c,tuning,4);
  const flat=/b/.test(name);
  const tonesTxt=c.tones.map(function(t){ return pcToNote(t,flat); }).join(" \u00B7 ");
  /* related: same root other qualities, plus the key this chord is tonic of */
  const dia=diatonic(c.root, c.quality.indexOf("m")===0&&c.quality!=="maj7"?"Natural minor":"Major", false);
  const sc=document.getElementById("scrim");
  sc.className="scrim on";
  sc.innerHTML='<div class="dlg" style="max-width:440px;max-height:86vh;overflow-y:auto">'+
    '<h3>'+esc(c.name)+'</h3>'+
    '<p>'+esc(CHORD_LABEL[c.quality]||c.quality)+' \u00B7 '+esc(tonesTxt)+'</p>'+
    '<div style="margin-top:20px"><div class="label" style="margin-bottom:10px">Piano</div>'+
    pianoSVG(c.tones,300)+'</div>'+
    '<div style="margin-top:22px"><div class="label" style="margin-bottom:10px">Guitar \u00B7 '+
      esc(tuning)+'</div>'+
    (vs.length
      ? '<div style="display:flex;gap:14px;flex-wrap:wrap">'+vs.map(function(v){
          return '<div style="text-align:center">'+fretSVG(v,84)+
            '<span class="diff '+(v.difficulty==="Medium"?"med":v.difficulty==="Hard"?"hard":"")+
            '" style="display:block;margin-top:4px">'+v.difficulty+'</span></div>'; }).join("")+'</div>'
      : '<p class="hint" style="margin:0">No playable shape found in this tuning.</p>')+
    '</div>'+
    '<div style="margin-top:22px"><div class="label" style="margin-bottom:10px">Related chords</div>'+
    '<div class="chips">'+dia.map(function(d){
      return '<span class="chip-c">'+esc(d.name)+' \u00B7 '+d.roman+'</span>'; }).join("")+'</div>'+
    '<p class="hint">The key of '+esc(c.name)+' \u2014 chords that sit naturally alongside it.</p></div>'+
    '<div class="dbtns"><button type="button" class="ok" id="dlg-close">Close</button></div></div>';
  const close=function(){ sc.className="scrim"; sc.innerHTML=""; };
  document.getElementById("dlg-close").onclick=close;
  sc.onclick=function(e){ if(e.target===sc) close(); };
}

function styleHTML(){
  const h=harmonicProfile();
  if(!h.songs) return '<div class="empty"><h2 class="serif">Nothing to read yet</h2>'+
    '<p>Add songs with keys and progressions and your harmonic fingerprint appears here.</p></div>';
  const ins=harmonicInsights();
  let out='<div class="answer" style="margin-top:0"><h4>What your harmony says about you</h4>'+
    ins.map(function(t){ return '<div class="aline"><i>\u2014</i><div>'+esc(t)+'</div></div>'; }).join("")+
    '</div>';
  out+='<div class="statgrid">'+
    '<div class="stat"><b>'+(h.keys[0]?esc(h.keys[0].k):"\u2014")+'</b><span>Home key</span></div>'+
    '<div class="stat"><b>'+(h.scales[0]?esc(h.scales[0].k):"\u2014")+'</b><span>Default mode</span></div>'+
    '<div class="stat"><b>'+(h.tempos[0]?h.tempos[0].k:"\u2014")+'</b><span>Typical tempo</span></div>'+
    '<div class="stat"><b>'+(h.tunings[0]?esc(h.tunings[0].k):"\u2014")+'</b><span>Usual tuning</span></div></div>';
  out+='<div class="section-head"><div class="label">Harmonic moves</div>'+
    '<span class="more">Across every progression</span></div>'+barsHTML(h.moves,8);
  out+='<div class="section-head"><div class="label">Chord vocabulary</div></div>'+barsHTML(h.types,8);
  out+='<div class="section-head"><div class="label">Keys</div></div>'+barsHTML(h.keys,6);
  out+='<div class="section-head"><div class="label">Capo positions</div></div>'+barsHTML(h.capos,5);
  out+='<div class="section-head"><div class="label">Structures</div></div>'+barsHTML(h.structures,5);
  /* catalogue-wide similarity sweep */
  const pairs=[]; const seen={};
  state.songs.filter(function(x){ return !x.archived; }).forEach(function(a){
    similarTo(a).forEach(function(m){
      const k=[a.id,m.song.id].sort().join("|");
      if(seen[k]||m.score<55) return;
      seen[k]=1; pairs.push({a:a,b:m.song,score:m.score,reasons:m.reasons});
    });
  });
  if(pairs.length){
    out+='<div class="section-head"><div class="label" style="color:var(--ember)">Songs treading the same ground</div></div>'+
      '<div style="padding:0 24px">'+pairs.sort(function(x,y){ return y.score-x.score; }).slice(0,5)
      .map(function(p){
        return '<div class="sim'+(p.score>=70?' high':'')+'"><div class="sim-top">'+
          '<h5>'+esc(p.a.title)+' \u2194 '+esc(p.b.title)+'</h5>'+
          '<span class="pcth">'+p.score+'%</span></div>'+
          '<p>'+esc(p.reasons.join(", "))+'.</p></div>';
      }).join("")+'</div>'+
      '<p class="hint" style="padding:12px 24px 20px">Repetition builds a signature. Flagged here so it stays a choice.</p>';
  }
  return out;
}

function theoryRefHTML(){
  const f=byId(state.focusId);
  const rootPc=f?noteToPc(f.songkey):-1;
  const mode=(f&&f.scale)||"Major";
  if(rootPc<0) return '<div class="empty"><h2 class="serif">Pick a focus song</h2>'+
    '<p>Pin a song with a key set and this panel explains the theory in the context of what you\u2019re writing.</p></div>';
  const dia=diatonic(rootPc,mode,false), dia7=diatonic(rootPc,mode,true);
  const bor=borrowed(rootPc,mode), sd=secondaryDominants(rootPc,mode), subs=substitutions(rootPc,mode);
  const flat=useFlats(rootPc,mode);
  const sc=scaleNotes(rootPc,mode).map(function(t){ return pcToNote(t,flat); });
  return '<div style="padding:0 24px 8px"><p class="hint" style="margin:0 0 18px">'+
    'Everything below is worked out for <b>'+esc(f.title)+'</b> \u2014 '+
    esc(pcToNote(rootPc,flat))+' '+esc(mode)+'.</p></div>'+
    '<div class="theory"><h5>The scale</h5><div class="row">'+sc.map(function(n){
      return '<span class="chip-c">'+esc(n)+'</span>'; }).join("")+'</div>'+
    '<p class="why">Melodies built from these notes will always sit inside the key.</p></div>'+
    '<div class="theory"><h5>Diatonic triads</h5><div class="row">'+dia.map(function(d){
      return '<span class="chip-c">'+esc(d.name)+' \u00B7 '+d.roman+'</span>'; }).join("")+'</div>'+
    '<p class="why">Built by stacking thirds on each degree of the scale. Uppercase numerals are major, '+
    'lowercase minor, \u00B0 diminished.</p></div>'+
    '<div class="theory"><h5>Sevenths</h5><div class="row">'+dia7.map(function(d){
      return '<span class="chip-c">'+esc(d.name)+'</span>'; }).join("")+'</div>'+
    '<p class="why">Add the seventh degree and triads become richer and more ambiguous \u2014 the usual move '+
    'when a progression feels too plain.</p></div>'+
    '<div class="theory"><h5>Modal interchange</h5><div class="row">'+bor.slice(0,7).map(function(d){
      return '<span class="chip-c out">'+esc(d.name)+' \u00B7 '+d.roman+'</span>'; }).join("")+'</div>'+
    '<p class="why">'+(bor.length?esc(bor[0].why):"")+'</p></div>'+
    '<div class="theory"><h5>Secondary dominants</h5>'+sd.map(function(d){
      return '<div class="row" style="margin-bottom:3px"><span class="chip-c out">'+esc(d.name)+
        ' \u00B7 '+esc(d.roman)+'</span></div><p class="why" style="margin-bottom:11px">'+
        esc(d.why)+'</p>'; }).join("")+'</div>'+
    '<div class="theory"><h5>Substitutions</h5>'+subs.map(function(x){
      return '<div class="row" style="margin-bottom:3px"><span class="chip-c">'+esc(x.name)+'</span></div>'+
        '<p class="why" style="margin-bottom:11px">'+esc(x.why)+'</p>'; }).join("")+'</div>';
}

  body.querySelectorAll("[data-gpre]").forEach(function(el){
    el.oninput=function(e){
      const g=list.find(function(x){ return x.id===el.dataset.gpre; });
      if(g){ g.presets=e.target.value; queueSave(); }
    };
  });
  body.querySelectorAll("[data-guse]").forEach(function(el){
    el.oninput=function(e){
      const g=list.find(function(x){ return x.id===el.dataset.guse; });
      if(g){ g.uses=e.target.value; queueSave(); }

      const g=list.find(function(x){ return x.id===b.dataset.gdel; });

function openSong(id){
  openId=id; pane="overview";

  window.scrollTo(0,0);
}
function closeSheet(){
  openId=null;

  document.body.style.overflow="";

}
function flag(){
  const f=document.getElementById("saveflag"); if(!f) return;
  f.classList.add("on"); clearTimeout(f._t);
  f._t=setTimeout(function(){ f.classList.remove("on"); },900);
}
function renderSheet(){
  const s=byId(openId); if(!s) return closeSheet();
  document.getElementById("sheet").innerHTML=
    '<div class="sheetbar"><button id="back">\u2190 Studio</button>'+
      '<span class="saveflag" id="saveflag">Saved</span>'+
      '<button class="go" id="sesgo">\u25B6 Session</button></div>'+

      '<input class="in-title" id="f-title" value="'+esc(s.title)+'" placeholder="Untitled">'+
      '<div class="stageline">'+LIFE[s.stage][0]+' \u00B7 '+progressOf(s)+'%'+
        (s.audio.length?' \u00B7 '+s.audio.length+' version'+(s.audio.length>1?'s':''):'')+
        (s.priority===2?' \u00B7 Priority':'')+'</div>'+

      '</div></div>'+

      return '<button data-p="'+p[0]+'" aria-selected="'+(pane===p[0])+'">'+p[1]+'</button>'; }).join("")+'</div>'+
    '<div class="pane" id="pane">'+paneHTML(s)+'</div>'+
    (pane==="overview"?actsHTML(s):"");

    document.getElementById("sheet").classList.remove("open"); openId=null; startSession(s.id);

  });

    s.title=e.target.value||"Untitled"; touch(s); flag();

function gearPick(s, field, cat, label){
  const opts=gearNames(cat);
  if(!opts.length) return '<span class="sublabel">'+label+'</span>'+
    '<p class="hint">Nothing in '+cat+' yet — add it under Gear.</p>';
  return '<span class="sublabel">'+label+'</span><div class="pick gear" data-pickfield="'+field+'">'+
    opts.map(function(n){
      return '<button data-gv="'+esc(n)+'" aria-pressed="'+(s[field].indexOf(n)!==-1)+'">'+esc(n)+'</button>';
    }).join("")+'</div>';

function paneHTML(s){

  if(pane==="harmony"){

         'however you like \u2014 <em>Am F C G</em> or <em>Am \u2192 F \u2192 C \u2192 G</em> both work.</p>';

    h+='<div class="rowadd" style="margin-top:14px">'+
      '<select id="p-sec" style="flex:0 0 128px">'+SECTIONS.map(function(x){
        return '<option>'+x+'</option>'; }).join("")+'</select>'+

    if(known) h+='<p class="hint">Chords outside the key are marked in red \u2014 that\u2019s information, not a mistake.</p>';

        h+='<div class="theory"><h5>In the key of '+esc(pcToNote(rootPc,useFlats(rootPc,mode)))+' '+esc(mode)+'</h5>'+

  const inAlbum=state.album.tracks.indexOf(s.id)!==-1;
  return '<div class="acts">'+
    '<button class="act key" id="a-ses">\u25B6 Start a session on this song</button>'+
    '<button class="act '+(state.focusId===s.id?"on":"")+'" id="a-focus">'+
      (state.focusId===s.id?"\u2605 Pinned as today\u2019s focus":"Pin as today\u2019s focus")+'</button>'+
    '<button class="act '+(inAlbum?"on":"")+'" id="a-album">'+(inAlbum?"On the album":"Add to the album")+'</button>'+
    '<button class="act" id="a-dupe">Duplicate this song</button>'+
    '<button class="act" id="a-arch">'+(s.archived?"Restore from archive":"Archive this song")+'</button>'+
    '<button class="act danger" id="a-del">Delete permanently</button></div>';
}
function bind(id,fn){
  const el=document.getElementById(id);
  if(el) el.oninput=function(e){ fn(e.target.value); flag(); };
}
function bindGearPicks(s){
  document.querySelectorAll("[data-pickfield]").forEach(function(box){
    const field=box.dataset.pickfield;
    box.querySelectorAll("[data-gv]").forEach(function(b){
      b.onclick=function(){
        const v=b.dataset.gv, i=s[field].indexOf(v);
        if(i>=0) s[field].splice(i,1); else s[field].push(v);
        touch(s); b.setAttribute("aria-pressed", String(i<0));
      };
    });
  });
}
function bindPane(s){
  if(pane==="overview"){
    document.querySelectorAll("[data-life]").forEach(function(b){
      b.onclick=function(){
        const i=Number(b.dataset.life);
        if(i!==s.stage) logEvent(s,"Moved to "+LIFE[i][0],"key");
        s.stage=i; touch(s); renderSheet();
      };
    });
    document.querySelectorAll("#pk-prio button").forEach(function(b){
      b.onclick=function(){ s.priority=Number(b.dataset.i); touch(s); renderSheet(); };
    });
    bind("f-goal",function(v){ s.goal=v; touch(s); });
    bind("f-next",function(v){ s.nextAction=v; touch(s); });
    bind("f-est",function(v){ s.estimate=v; touch(s); });
    bind("f-track",function(v){ s.trackNo=v; touch(s); });
    bind("f-genre",function(v){ s.genre=v; touch(s); });
    bind("f-sub",function(v){ s.subgenre=v; touch(s); });
    bind("f-mood",function(v){ s.mood=v; touch(s); });
    bind("f-em1",function(v){ s.emotion1=v; touch(s); });
    bind("f-em2",function(v){ s.emotion2=v; touch(s); });
    document.getElementById("a-ses").onclick=function(){
      document.getElementById("sheet").classList.remove("open"); openId=null; startSession(s.id);
    };
    document.getElementById("a-focus").onclick=function(){
      state.focusId=state.focusId===s.id?null:s.id;
      if(state.focusId) logEvent(s,"Set as today\u2019s focus");
      queueSave(); renderSheet();
      toast(state.focusId?"Pinned as today\u2019s focus":"Unpinned");
    };
    document.getElementById("a-album").onclick=function(){
      const i=state.album.tracks.indexOf(s.id);
      if(i>=0){ state.album.tracks.splice(i,1); logEvent(s,"Removed from the album"); toast("Removed"); }
      else { state.album.tracks.push(s.id); logEvent(s,"Added to the album"); toast("Added to the album"); }
      save(); renderSheet();
    };
    document.getElementById("a-dupe").onclick=async function(){
      const ok=await confirmDialog({
        title:"Duplicate \u201C"+s.title+"\u201D?",
        body:"Copies every field, lyric draft, progression and version record into a new song. "+
             "Tasks come across unticked. Audio files aren't copied \u2014 they're session-only.",
        ok:"Duplicate" });
      if(!ok) return;
      const copy=duplicateSong(s.id);
      if(copy){ closeSheet(); openSong(copy.id); toast("Duplicated"); }
    };
    document.getElementById("a-arch").onclick=async function(){
      if(!s.archived){
        const ok=await confirmDialog({
          title:"Archive \u201C"+s.title+"\u201D?",
          body:"It leaves the studio but keeps everything. Find it again under the Archived filter in Songs.",
          ok:"Archive" });
        if(!ok) return;
      }
      setArchived(s.id, !s.archived);
      closeSheet();
    };
    document.getElementById("a-del").onclick=async function(){
      const ok=await confirmDialog({
        title:"Delete \u201C"+s.title+"\u201D?",
        body:"This removes the song and everything attached to it \u2014 lyrics, progressions, "+
             "tasks, notes, audio version records and history. You'll have a few seconds to undo.",
        ok:"Delete song", danger:true });
      if(!ok) return;
      deleteSong(s.id);
      closeSheet();
    };
  }

  if(pane==="story"){
    bind("f-story",function(v){ s.story=v; touch(s); });
    bind("f-mean",function(v){ s.meaning=v; touch(s); });
    bind("f-insp",function(v){ s.inspiration=v; touch(s); });
    bind("f-vis",function(v){ s.visual=v; touch(s); });
  }

  if(pane==="harmony"){
    bind("m-bpm",function(v){ s.bpm=v; touch(s); });
    bind("m-sig",function(v){ s.timeSig=v; touch(s); });
    bind("m-tune",function(v){ s.tuning=v; touch(s); });
    bind("m-capo",function(v){ s.capo=v; touch(s); });
    bind("m-tempo",function(v){ s.tempoChanges=v; touch(s); });
    bind("m-riff",function(v){ s.riff=v; touch(s); });
    bind("m-mel",function(v){ s.melody=v; touch(s); });
    bind("m-struct",function(v){ s.structure=v; touch(s); });
    bind("m-dyn",function(v){ s.dynamics=v; touch(s); });
    /* key change re-runs the whole analysis, so re-render on commit not per keystroke */
    const ki=document.getElementById("m-key");
    if(ki){
      ki.oninput=function(e){ s.songkey=e.target.value; touch(s); flag(); };
      ki.onblur=function(){ renderSheet(); };
    }
    document.querySelectorAll("#pk-scale button").forEach(function(b){
      b.onclick=function(){
        s.scale = s.scale===b.dataset.sc ? "" : b.dataset.sc;
        touch(s); renderSheet();
      };
    });
    const padd=document.getElementById("p-add");
    if(padd) padd.onclick=function(){
      const sec=document.getElementById("p-sec").value;
      s.progressions.push({id:vid(), section:sec, chords:"", label:"", note:"", created:Date.now()});
      logEvent(s,"Added a "+sec+" progression");
      touch(s); renderSheet();
    };
    document.querySelectorAll("[data-pchords]").forEach(function(el){
      const p=s.progressions.find(function(x){ return x.id===el.dataset.pchords; });
      if(!p) return;
      el.oninput=function(e){ p.chords=e.target.value; touch(s); flag(); };
      el.onblur=function(){ renderSheet(); };
    });
    document.querySelectorAll("[data-pnote]").forEach(function(el){
      const p=s.progressions.find(function(x){ return x.id===el.dataset.pnote; });
      if(p) el.oninput=function(e){ p.note=e.target.value; touch(s); flag(); };
    });
    document.querySelectorAll("[data-pdel]").forEach(function(b){
      b.onclick=async function(){
        const p=s.progressions.find(function(x){ return x.id===b.dataset.pdel; });
        if(!p) return;
        const ok=await confirmDialog({ title:"Delete this "+p.section+" progression?",
          body:p.chords?("\u201C"+p.chords+"\u201D will be removed from this song."):"It's empty anyway.",
          ok:"Delete", danger:true });
        if(!ok) return;
        s.progressions=s.progressions.filter(function(x){ return x.id!==p.id; });
        touch(s); renderSheet(); toast("Progression deleted");
      };
    });
  }

  if(pane==="writing"){
    const nv=document.getElementById("newver");
    if(nv) nv.onclick=function(){
      const n=s.lyricVersions.length+1;
      let prev=null;
      for(let i=0;i<s.lyricVersions.length;i++) if(s.lyricVersions[i].id===s.activeLyricId) prev=s.lyricVersions[i];
      const v={id:vid(), name:"Draft "+n, content:prev?prev.content:"", note:"", created:Date.now()};
      s.lyricVersions.push(v); s.activeLyricId=v.id;
      logEvent(s,"Started lyric version \u201C"+v.name+"\u201D");
      touch(s); renderSheet(); toast("New version started");
    };
    document.querySelectorAll("[data-v]").forEach(function(b){
      b.onclick=function(){ s.activeLyricId=b.dataset.v; queueSave(); renderSheet(); };
    });
    let cur=null;
    for(let i=0;i<s.lyricVersions.length;i++) if(s.lyricVersions[i].id===s.activeLyricId) cur=s.lyricVersions[i];
    if(cur){
      bind("f-lyr",function(v){ cur.content=v; touch(s); });
      bind("f-vnote",function(v){ cur.note=v; touch(s); });
      bind("f-vname",function(v){ cur.name=v||"Untitled"; touch(s); });
      const dv=document.getElementById("delver");
      if(dv) dv.onclick=async function(){
        const ok=await confirmDialog({ title:"Delete \u201C"+cur.name+"\u201D?",
          body:"This lyric draft goes for good. Other drafts of this song stay.",
          ok:"Delete draft", danger:true });
        if(!ok) return;
        s.lyricVersions=s.lyricVersions.filter(function(v){ return v.id!==cur.id; });
        s.activeLyricId=s.lyricVersions[0]?s.lyricVersions[0].id:null;
        touch(s); renderSheet(); toast("Version deleted");
      };
    }
    bind("w-fav",function(v){ s.favLines=v; touch(s); });
    bind("w-weak",function(v){ s.weakLines=v; touch(s); });
    bind("w-themes",function(v){ s.themes=v; touch(s); });
    bind("w-refs",function(v){ s.refs=v; touch(s); });
    bind("w-notes",function(v){ s.writeNotes=v; touch(s); });
  }

  if(pane==="recording"){
    bind("r-date",function(v){ s.recordDate=v; touch(s); });
    bind("r-chain",function(v){ s.effectsChain=v; touch(s); });
    bind("r-proj",function(v){ s.projectFile=v; touch(s); });
    bindGearPicks(s);
  }

  if(pane==="production"){
    bind("p-rec",function(v){ s.prod.recording=v; touch(s); });
    bind("p-pro",function(v){ s.prod.production=v; touch(s); });
    bind("p-mix",function(v){ s.prod.mixing=v; touch(s); });
    bind("p-mas",function(v){ s.prod.mastering=v; touch(s); });
  }

  if(pane==="audio"){
    const add=document.getElementById("addver");
    if(add) add.onclick=function(){
      const n=s.audio.length+1;
      const v={ id:vid(), name:s.title.replace(/\s+/g,"_")+"_v"+n, status:s.stage, notes:"",
                date:Date.now(), fileName:"", duration:0, sampleRate:0, bitDepth:0, channels:0, peaks:[] };
      s.audio.push(v);
      logEvent(s,"Added audio version \u201C"+v.name+"\u201D","audio");
      pendingVer=v.id; touch(s); renderSheet();
      document.getElementById("filepick").click();
    };
    const rc=document.getElementById("recall");
    if(rc) rc.onclick=function(){ document.getElementById("multipick").click(); };
    renderTransports();          /* draw the in-song player */
    document.querySelectorAll("[data-play]").forEach(function(b){
      b.onclick=function(){ playVersion(s.id,b.dataset.play); };
    });
    document.querySelectorAll("[data-vfile]").forEach(function(b){
      b.onclick=function(){ pendingVer=b.dataset.vfile; document.getElementById("filepick").click(); };
    });
    document.querySelectorAll("[data-vdrop]").forEach(function(b){
      b.onclick=function(){
        const v=verById(s,b.dataset.vdrop); if(!v) return;
        detachFile(v); renderSheet(); toast("File released — the version record stays");
      };
    });
    document.querySelectorAll("[data-vname]").forEach(function(el){
      el.oninput=function(e){
        const v=verById(s,el.dataset.vname); if(v){ v.name=e.target.value; touch(s); flag(); }
      };
    });
    document.querySelectorAll("[data-vnote]").forEach(function(el){
      el.oninput=function(e){
        const v=verById(s,el.dataset.vnote); if(v){ v.notes=e.target.value; touch(s); flag(); }
      };
    });
    document.querySelectorAll("[data-vdel]").forEach(function(b){
      b.onclick=async function(){
        const v=verById(s,b.dataset.vdel); if(!v) return;
        const ok=await confirmDialog({ title:"Delete \u201C"+v.name+"\u201D?",
          body:"Removes this version record and its notes. Your file on disk isn't touched.",
          ok:"Delete version", danger:true });
        if(!ok) return;
        detachFile(v);
        s.audio=s.audio.filter(function(x){ return x.id!==v.id; });
        logEvent(s,"Deleted version \u201C"+v.name+"\u201D","audio");
        touch(s); save(); renderSheet(); toast("Version deleted");
      };
    });
    document.querySelectorAll(".ver .wave").forEach(function(w){
      const holder=w.closest(".ver");
      if(holder) w.onclick=function(){ playVersion(s.id,holder.dataset.ver); };
    });
  }

  if(pane==="release"){
    bind("rl-art",function(v){ s.artwork=v; touch(s); });
    bind("rl-cred",function(v){ s.credits=v; touch(s); });
    bind("rl-check",function(v){ s.releaseChecklist=v; touch(s); });
    bind("rl-vid",function(v){ s.videoNotes=v; touch(s); });
  }

  if(pane==="tasks"){
    const input=document.getElementById("t-new");
    function add(){
      const txt=input.value.trim(); if(!txt) return;
      s.tasks.push({id:vid(), text:txt, done:false, created:Date.now()});
      input.value=""; touch(s); renderSheet();
      setTimeout(function(){ const i=document.getElementById("t-new"); if(i) i.focus(); },40);
    }
    document.getElementById("t-add").onclick=add;
    input.onkeydown=function(e){ if(e.key==="Enter") add(); };
    document.querySelectorAll("[data-t]").forEach(function(b){
      b.onclick=function(){
        let t=null;
        for(let i=0;i<s.tasks.length;i++) if(s.tasks[i].id===b.dataset.t) t=s.tasks[i];
        if(!t) return;
        t.done=!t.done;
        if(t.done) logEvent(s,"Done: "+t.text);
        touch(s); renderSheet();
      };
    });
    document.querySelectorAll("[data-tx]").forEach(function(b){
      b.onclick=function(){
        s.tasks=s.tasks.filter(function(x){ return x.id!==b.dataset.tx; });
        touch(s); renderSheet();
      };
    });
  }
}

/* ============ 9  SESSION ============ */
function startSession(songId){
  const s=songId?byId(songId):null;
  if(!s){
    const open=live().filter(function(x){ return !isDone(x); }).sort(function(a,b){ return score(b)-score(a); });
    if(!open.length){ toast("No open songs to work on"); return; }
    return startSession(open[0].id);
  }
  ses={ songId:s.id, start:Date.now(), notes:"", stageFrom:s.stage,
        tasksBefore:s.tasks.filter(function(t){ return t.done; }).map(function(t){ return t.id; }),
        ended:false };
  document.getElementById("session").classList.add("on");
  document.body.style.overflow="hidden";
  renderSession();
  clearInterval(sesTick);
  sesTick=setInterval(function(){
    const t=document.getElementById("sesTimer");
    if(t&&ses&&!ses.ended) t.textContent=longclock((Date.now()-ses.start)/1000);
  },1000);
}
function renderSession(){
  const el=document.getElementById("session");
  if(!ses){ el.classList.remove("on"); document.body.style.overflow=""; return; }
  const s=byId(ses.songId);
  if(!s) return endSessionDiscard();
  if(ses.ended) return renderSessionSummary(s);
  const open=s.tasks.filter(function(t){ return !t.done; });
  const done=s.tasks.filter(function(t){ return t.done; });
  el.innerHTML=
    '<div class="ses-wash" style="'+artStyle(s)+'"></div><div class="ses-veil"></div>'+
    '<div class="ses-in">'+
      '<div class="label">Session in progress</div>'+
      '<div class="timer run" id="sesTimer">'+longclock((Date.now()-ses.start)/1000)+'</div>'+
      '<h2 class="ses-song">'+esc(s.title)+'</h2>'+
      '<p class="ses-goal">'+esc(s.goal||s.nextAction||"No goal set \u2014 decide one now.")+'</p>'+
      '<div class="ses-block"><span class="label">Lifecycle \u00B7 '+LIFE[s.stage][0]+'</span>'+
        '<div class="lifebar">'+LIFE.map(function(l,i){
          return '<u class="'+(i<s.stage?"on":i===s.stage?"now":"")+'"></u>'; }).join("")+'</div>'+
        '<div class="ses-btns" style="margin-top:14px">'+
        '<button id="ses-back">\u2190 Back a stage</button>'+
        '<button class="key" id="ses-fwd">Advance \u2192</button></div></div>'+
      '<div class="ses-block"><span class="label">Tasks</span>'+
        (s.tasks.length?open.concat(done).map(function(t){
          return '<div class="task '+(t.done?"done":"")+'">'+
            '<button class="box '+(t.done?"on":"")+'" data-st="'+t.id+'" aria-label="Toggle"></button>'+
            '<p>'+esc(t.text)+'</p></div>';
        }).join(""):'<p style="color:var(--faint);font-style:italic;margin:0">No tasks on this song.</p>')+
        '<div class="rowadd" style="margin-top:16px"><input id="ses-task" placeholder="Add a task\u2026">'+
        '<button id="ses-taskadd">Add</button></div></div>'+
      '<div class="ses-block"><span class="label">Session notes</span>'+
        '<textarea class="in" id="ses-notes" rows="5" placeholder="What are you trying? What\u2019s working?">'+
        esc(ses.notes)+'</textarea></div>'+
      '<div class="ses-btns"><button id="ses-open">Open song</button>'+
      '<button class="key" id="ses-end">End session</button></div>'+
      '<div style="margin-top:12px"><button class="act danger" id="ses-cancel">Discard session</button></div>'+
    '</div>';
  document.getElementById("ses-notes").oninput=function(e){ ses.notes=e.target.value; };
  document.getElementById("ses-fwd").onclick=function(){
    if(s.stage<LIFE.length-1){ s.stage++; logEvent(s,"Moved to "+LIFE[s.stage][0],"key"); touch(s); renderSession(); }
  };
  document.getElementById("ses-back").onclick=function(){
    if(s.stage>0){ s.stage--; logEvent(s,"Moved back to "+LIFE[s.stage][0],"key"); touch(s); renderSession(); }
  };
  document.querySelectorAll("[data-st]").forEach(function(b){
    b.onclick=function(){
      let t=null;
      for(let i=0;i<s.tasks.length;i++) if(s.tasks[i].id===b.dataset.st) t=s.tasks[i];
      if(!t) return;
      t.done=!t.done;
      if(t.done) logEvent(s,"Done: "+t.text);
      touch(s); renderSession();
    };
  });
  const ti=document.getElementById("ses-task");
  function addT(){
    const v=ti.value.trim(); if(!v) return;
    s.tasks.push({id:vid(), text:v, done:false, created:Date.now()});
    ti.value=""; touch(s); renderSession();
  }
  document.getElementById("ses-taskadd").onclick=addT;
  ti.onkeydown=function(e){ if(e.key==="Enter") addT(); };
  document.getElementById("ses-open").onclick=function(){
    document.getElementById("session").classList.remove("on");
    document.body.style.overflow=""; openSong(s.id);
  };
  document.getElementById("ses-end").onclick=function(){ ses.ended=true; ses.end=Date.now(); renderSession(); };
  document.getElementById("ses-cancel").onclick=async function(){
    const ok=await confirmDialog({ title:"Discard this session?",
      body:"Work you did on the song is kept. Only the session record and its timer are thrown away.",
      ok:"Discard", danger:true });
    if(ok) endSessionDiscard();
  };
}
function renderSessionSummary(s){
  const mins=Math.max(1,Math.round((ses.end-ses.start)/60000));
  const doneNow=s.tasks.filter(function(t){ return t.done&&ses.tasksBefore.indexOf(t.id)===-1; });
  const moved=s.stage!==ses.stageFrom;
  document.getElementById("session").innerHTML=
    '<div class="ses-wash" style="'+artStyle(s)+'"></div><div class="ses-veil"></div>'+
    '<div class="ses-in"><div class="label">Session complete</div>'+
    '<div class="timer">'+mins+'<span style="font-size:22px"> min</span></div>'+
    '<h2 class="ses-song">'+esc(s.title)+'</h2>'+
    '<div class="ses-block"><span class="label">What changed</span>'+
      '<div class="sumrow"><span>Lifecycle</span><b>'+
        (moved?LIFE[ses.stageFrom][1]+" \u2192 "+LIFE[s.stage][1]:LIFE[s.stage][0]+" (no change)")+'</b></div>'+
      '<div class="sumrow"><span>Progress</span><b>'+progressOf(s)+'%</b></div>'+
      '<div class="sumrow"><span>Tasks completed</span><b>'+doneNow.length+'</b></div>'+
      doneNow.map(function(t){
        return '<div class="sumrow"><span style="color:var(--faint)">\u2713 '+esc(t.text)+'</span></div>'; }).join("")+
      '</div>'+
    '<div class="ses-block"><span class="label">What should happen next</span>'+
      '<input class="in" id="sum-next" value="'+esc(s.nextAction)+'" placeholder="The next action for this song"></div>'+
    '<div class="ses-block"><span class="label">Session notes</span>'+
      '<textarea class="in" id="sum-notes" rows="4" placeholder="Anything worth remembering">'+esc(ses.notes)+'</textarea></div>'+
    '<div class="ses-btns"><button class="key" id="sum-save">Save session</button></div></div>';
  document.getElementById("sum-next").oninput=function(e){ s.nextAction=e.target.value; touch(s); };
  document.getElementById("sum-notes").oninput=function(e){ ses.notes=e.target.value; };
  document.getElementById("sum-save").onclick=function(){
    state.sessions.unshift({ id:vid(), songId:s.id, songTitle:s.title, start:ses.start, end:ses.end,
      minutes:mins, notes:ses.notes, tasksDone:doneNow.length,
      stageFrom:ses.stageFrom, stageTo:s.stage });
    if(state.sessions.length>250) state.sessions.length=250;
    logEvent(s, mins+" min session"+
      (doneNow.length?", "+doneNow.length+" task"+(doneNow.length>1?"s":"")+" done":"")+
      (moved?", now at "+LIFE[s.stage][0]:"")+
      (ses.notes?" \u2014 "+ses.notes.slice(0,90):""), "session");
    markActivity(); touch(s); save();
    endSessionDiscard(); toast("Session saved");
  };
}
function endSessionDiscard(){
  clearInterval(sesTick); ses=null;
  const el=document.getElementById("session");
  el.classList.remove("on"); el.innerHTML="";
  document.body.style.overflow="";
  renderAll();
}

/* ============ 10  SHELL ============ */
document.getElementById("filepick").onchange=async function(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file||!pendingVer) return;
  const verId=pendingVer; pendingVer=null;
  if(!isAudioFile(file)){
    toast("Ivan OS takes audio only — MP3, WAV, AIFF, FLAC, OGG, M4A");
    return;
  }
  let song=null, ver=null;
  for(const s of state.songs){
    const v=verById(s,verId);
    if(v){ song=s; ver=v; break; }
  }
  if(!song||!ver) return;
  await attachFile(song,ver,file);
  if(openId===song.id&&pane==="audio") renderSheet();
  renderAll();
};
document.getElementById("multipick").onchange=async function(e){
  const list=Array.prototype.slice.call(e.target.files||[]);
  e.target.value="";
  if(!list.length) return;
  toast("Matching "+list.length+" file"+(list.length>1?"s":"")+"\u2026");
  await reconnectBatch(list);
};
function go(v){
  view=v;
  ["studio","songs","album","compose","producer","gear"].forEach(function(k){
    document.getElementById("v-"+k).classList.toggle("on",k===v);
  });
  document.querySelectorAll("#nav button").forEach(function(b){
    b.setAttribute("aria-current",String(b.dataset.v===v));
  });
  renderAll(); window.scrollTo(0,0);
}
function renderAll(){
  if(view==="studio") renderStudio();
  else if(view==="songs") renderSongs();
  else if(view==="album") renderAlbum();
  else if(view==="compose") renderCompose();
  else if(view==="producer") renderProducer();
  else renderGear();
}
function newSong(){
  const s=blank({id:uid()});
  logEvent(s,"Song created","key");
  state.songs.push(s);
  markActivity(); save(); openSong(s.id);
  setTimeout(function(){ const t=document.getElementById("f-title"); if(t){ t.focus(); t.select(); } },120);
}
document.querySelectorAll("#nav button").forEach(function(b){
  b.onclick=function(){ go(b.dataset.v); };
});
document.getElementById("fab").onclick=newSong;
document.getElementById("resetBtn").onclick=async function(){
  const ok=await confirmDialog({ title:"Reset everything?",
    body:"Every song, lyric, progression, task, note, session and your gear lists are erased. There is no undo for this one.",
    ok:"Erase everything", danger:true });
  if(!ok) return;
  stopPlayer();
  state={ songs:[], album:{title:"Untitled Album",notes:"",tracks:[]}, focusId:null,
          sessions:[], activity:{}, quickNote:"", goals:[], gear:[], software:[], wishlist:[], insights:[] };
  normalize(); await save(); renderAll(); toast("Everything cleared");
};
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape"||ses) return;
  if(openId) closeSheet();
});

(async function(){
  await load();
  renderAll();
  renderPlayer();
  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("/sw.js"); }
    catch(e){}
  }
})();
</script>
</body>
</html>
